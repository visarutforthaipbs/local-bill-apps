function loadDraft(id){
  try{
    const key=id===undefined?editDraftStorageKey:editorDraftKey(id);
    let raw=localStorage.getItem(key);
    // Earlier versions used one unscoped new-document draft. Offer explicit recovery once.
    if(!raw&&key===editorDraftKey(null)){
      const legacyRaw=localStorage.getItem(EDIT_DRAFT_KEY);
      const legacy=JSON.parse(legacyRaw||'null');
      if(legacy?.doc&&legacy.doc.id==null){
        raw=legacyRaw;
        try{localStorage.setItem(key,raw);localStorage.removeItem(EDIT_DRAFT_KEY);}catch(e){}
      }
    }
    if(!raw)return null;
    const value=JSON.parse(raw);return value&&value.doc?value:null;
  }catch(e){return null;}
}

function applyVatStatus(b,value){

function issueBlockers(d){

  const items=Array.isArray(d.items)?d.items:[];
  if(!items.length || items.some(it=>!it || !String(it.description||'').trim())) add(tr('ใส่รายละเอียดให้ทุกรายการ'));
  if(items.some(it=>it && (!Number.isFinite(Number(it.qty)) || Number(it.qty)<=0 || !Number.isFinite(Number(it.price)) || Number(it.price)<0)))
    add(tr('จำนวนต้องมากกว่า 0 และราคาต้องไม่ติดลบ'));
  if(hasUnroundedPrice(d)) add(tr('ราคาต่อหน่วยใช้ทศนิยมได้ไม่เกิน 2 ตำแหน่ง'),'roundEditorPrices()',tr('ปัดเป็น 2 ตำแหน่ง'));
  const t=compute(d); if(!(Number.isFinite(t.grandTotal) && t.grandTotal>0)) add(tr('ยอดรวมต้องมากกว่า 0'));
  if(!Number.isFinite(Number(d.whtRate)) || Number(d.whtRate)<0 || Number(d.whtRate)>100) add(tr('อัตราหัก ณ ที่จ่ายต้องอยู่ระหว่าง 0–100%'));
  if(!String(b.businessName||'').trim() || !String(b.address||'').trim() || !/^\d{13}$/.test(String(b.taxId||'').trim()))
    add(tr('ใส่ชื่อ ที่อยู่ และเลขประจำตัวผู้เสียภาษี 13 หลักของคุณในตั้งค่า'),'openBusinessSettings()',tr('ไปที่ข้อมูลธุรกิจ'));
  if(!d.whtReviewed) add(tr('ตรวจอัตราหัก ณ ที่จ่ายกับผู้จ่าย แล้วเปิดสวิตช์ยืนยัน'),'focusWhtReview()',tr('ไปที่สวิตช์'));
  if(d.type==='receipt'){
    if(b.vatStatus!=='non_registered') add(tr('กรุณายืนยันว่าไม่ได้จด VAT ในตั้งค่าก่อน'),b.vatStatus==='registered'?'openReceiptSettings()':'confirmReceiptPrerequisite()',tr('ยืนยันสถานะ VAT'));
    if(!validDocumentDate(d.paidDate) || d.paidDate>todayISO() || d.paidDate>d.issueDate || !d.fullPaymentConfirmed) add(tr('กรอกวันรับเงินจริงและยืนยันรับเต็มจำนวน'));
  }
  return out;
}

    .replace('{client}',cl.name||'—').replace('{amount}',curSymOf(t.currency)+money(t.netPayable));
  const b=DB.business;
  // An invoice without PromptPay or a bank account gives the client no way to pay; warn, never block.
  const noPayment=editDoc.type==='invoice' && !(t.currency==='THB' && promptpayPayload(b.promptpayId,null)) && !String(b.bankAccount||'').trim();
  const detail=tr('ออกแล้วแก้ไขหรือลบไม่ได้ ยกเลิกได้โดยระบุเหตุผลเท่านั้น')+(noPayment?'\n\n'+tr('ใบแจ้งหนี้นี้ยังไม่มีช่องทางรับเงิน (PromptPay หรือบัญชีธนาคาร) — เพิ่มได้ที่ ตั้งค่า → ธุรกิจของฉัน'):'');

async function saveDoc(){
  if(issuanceBusy || !editDoc) return;
  const existing=editDoc.id && DB.documents.find(x=>x.id===editDoc.id);
  if(existing && isIssuedDocument(existing)){toast(tr('เอกสารออกแล้ว แก้ไขไม่ได้'),'err');return;}
  const finalize=editDoc.issueConfirmed===true;
  if(finalize && editDoc.type==='receipt' && editDoc.parentId){
    toast(tr('ต้องมีใบแจ้งหนี้ที่ยืนยันรับเงินเต็มจำนวนแล้ว'),'err');return;
  }
  const error=issuanceError(editDoc,finalize);
  if(error){toast(error,'err');return;}
  // A new document keeps one id while its editor is open, so retrying after a lost network
  // response reuses the same synced number reservation instead of skipping a number.
  if(!editDoc.id) editDoc.pendingNewId=editDoc.pendingNewId||uid();
  const d=JSON.parse(JSON.stringify(editDoc)); delete d.pendingNewId;
  d.id=d.id||editDoc.pendingNewId||uid(); d.createdAt=d.createdAt||new Date().toISOString();
  d.status=finalize?(d.type==='receipt'?'issued':'sent'):'draft';
  if(d.type!=='receipt'){
    d.paidDate=null; d.fullPaymentConfirmed=false;
    for(const field of ['paymentId','whtCertReceived','whtCertNumber','whtCertDate']) delete d[field];
  }
  if(finalize && d.type==='receipt'){
    d.paymentId=d.paymentId||uid();
    if(docLangOf(d)==='en') d.docLang='bilingual';
  }
  issuanceBusy=true;
  try{
    if(!await persistDocumentMutation(d,existing?.id))return;
    editDoc=null; clearDraft(); closeModal(); viewDoc(d.id); toast(tr('บันทึกเอกสารแล้ว'),'ok',null,finalize?'issued':'saved');
  }finally{issuanceBusy=false;}
}
async function deleteDoc(id){
  const d=DB.documents.find(x=>x.id===id);
  if(!d) return false;
  if(isIssuedDocument(d)){ toast(tr('เอกสารที่ออกแล้วแก้ไขหรือลบไม่ได้'),'err'); return false; }
  if(!await askConfirm(tr('ลบร่างนี้?'),{detail:d.number||d.project||'',confirmLabel:tr('ลบร่าง'),danger:true}) || issuanceBusy) return false;
  const original={...d}; softDelete(d);
  if(!await persist(true)){ for(const k of Object.keys(d)) if(!(k in original)) delete d[k]; Object.assign(d,original); return false; }
  closeModal(); setView('documents');
  toast(tr('ลบร่างแล้ว'),'ok',{label:tr('เลิกทำ'),run:()=>undoSoftDelete(()=>DB.documents,id)});
  return true;
}
// Restore a record removed moments ago (soft delete keeps it as a tombstone).
async function undoSoftDelete(list,id){
  if(issuanceBusy||appClosing||loadFailed) return false;
  const arr=list(), i=arr.findIndex(r=>r.id===id);
  if(i<0||!arr[i].deletedAt) return false;
  const previous=arr[i], restored={...previous,deletedAt:null}; touch(restored);
  arr[i]=restored; issuanceBusy=true;
  try{ if(!await persist(true)){ arr[i]=previous; toast(tr('บันทึกการเปลี่ยนแปลงไม่สำเร็จ'),'err'); return false; } }
  catch(e){ arr[i]=previous; return false; }
  finally{ issuanceBusy=false; }
  render(); toast(tr('กู้คืนแล้ว'),'ok'); return true;
}

function isIssuedDocument(d){
  return !!d && ['quotation','invoice','receipt','tax_invoice'].includes(d.type) && d.status!=='draft';
}
function hasIssuedSnapshot(d){
  const s=d && d.issuedSnapshot;
  return !!(s && s.schemaVersion===1 && s.document && Array.isArray(s.document.items) && TYPE_LABEL[s.document.type]
    && s.business && s.buyer && ['th','bilingual','en'].includes(s.docLang) && s.amounts && typeof s.amounts.currency==='string'
    && ['subtotal','vatRate','whtRate','vatAmount','whtAmount','grandTotal','netPayable'].every(k=>Number.isFinite(s.amounts[k]))
    && typeof s.renderedHtml==='string' && typeof s.shareText==='string');
}
function documentHasNumberConflict(d){
  return !!(d.number && DB.documents.some(x=>x.id!==d.id && isIssuedDocument(x) && x.number===d.number))
    || !!(d.number && receiptReissues().some(e=>e.receipt.id!==d.id&&e.receipt.number===d.number))
    || !!d.syncConflict || (typeof syncConflicts!=='undefined' && syncConflicts.some(x=>x.id===d.id || x.recordId===d.id || (x.local && x.local.id===d.id)));
}
function documentOutputBlocked(d){
  return !d || d.type==='tax_invoice' || !!d.voidedAt || !!d.deletedAt || documentHasNumberConflict(d)
    || (isIssuedDocument(d) && (d.legacy_review_required || !hasIssuedSnapshot(d)));
}
function documentBlockMessage(d){
  if(d && d.deletedAt) return tr('เก็บจากการลบเดิม');
  if(d && d.type==='tax_invoice') return tr('ใบกำกับภาษีเดิมต้องให้ผู้เชี่ยวชาญตรวจสอบ');

  return d && documentHasNumberConflict(d) ? tr('พบเลขเอกสารซ้ำหรือข้อมูลขัดแย้ง กรุณาตรวจสอบ') : tr('เอกสารเดิมต้องตรวจสอบก่อนพิมพ์หรือส่งออก');
}

async function archiveDocument(id,archived){
  if(issuanceBusy)return false;
  const d=DB.documents.find(x=>x.id===id);if(!d)return false;const original={...d};
  d.archivedAt=archived?new Date().toISOString():null;touch(d);issuanceBusy=true;
  try{if(!await persist(true)){restoreRecord(d,original);return false;}}
  catch(e){restoreRecord(d,original);return false;}finally{issuanceBusy=false;}

  return true;
}

const CORRECTION_DELIVERY={unknown:'ยังไม่ทราบว่าส่งให้ลูกค้าหรือไม่',not_sent:'ยืนยันว่าไม่เคยส่งให้ลูกค้า',sent:'ส่งให้ลูกค้าแล้ว'};
let correctionSelection=new Set(),correctionPreview=null;
function correctionRecords(){return DB.documents.filter(d=>d.type==='tax_invoice');}
function correctionEvents(id){return (DB.reviewEvents||[]).filter(e=>e.type==='correction_review'&&e.documentId===id&&validCorrectionReviewEvent(e));}
function correctionProposal(id){return correctionEvents(id).find(e=>e.action==='prepare_proposal');}
function correctionEligibility(d){
  if(!d||d.type!=='tax_invoice'||d.deletedAt||d.voidedAt||d.status==='void')return 'เก็บจากการลบหรือยกเลิก ตรวจแยกต่างหาก';
  // Do not coerce null/empty VAT to zero or infer historical currency.
  if(![0,'0'].includes(d.vatRate)||d.currency!=='THB'||d.milestone||documentHasNumberConflict(d)||
    !Array.isArray(d.items)||!d.items.length||d.items.some(i=>!i||!String(i.description||'').trim()||!Number.isFinite(Number(i.qty))||Number(i.qty)<=0||!Number.isFinite(Number(i.price))||Number(i.price)<0)||
    !Number.isFinite(Number(d.whtRate))||d.whtRate==null||d.whtRate===''||Number(d.whtRate)<0||Number(d.whtRate)>100||!reportAmountsValid(compute(d))||
    compute(d).currency!=='THB'||compute(d).vatAmount!==0||compute(d).vatRate!==0)return 'มี VAT หรือข้อมูลไม่ครบ ตรวจแยกต่างหาก';
  if(correctionProposal(d.id))return 'มีข้อเสนอแล้ว เปิดตรวจได้';
  return '';
}
function buildCorrectionBatch(ids,facts,action){
  if(!Array.isArray(ids)||!ids.length||ids.length>500||new Set(ids).size!==ids.length||
    !['review','prepare_proposal'].includes(action)||!facts||!Object.hasOwn(CORRECTION_DELIVERY,facts.deliveryStatus)||facts.historicalVatConfirmed!==true||
    typeof facts.note!=='string'||!facts.note.trim()||facts.note.length>4000)throw Error(tr('เลือกเอกสาร ยืนยันสถานะ VAT และระบุบันทึกก่อน'));
  const rows=ids.map(id=>{
    const d=DB.documents.find(x=>x.id===id);if(!d||d.type!=='tax_invoice')throw Error(tr('ข้อมูลเปลี่ยนแล้ว กรุณาเปิดตัวอย่างใหม่'));
    const reason=correctionEligibility(d);if(action==='prepare_proposal'&&reason)throw Error(tr(reason));
    return {id,sourceJSON:JSON.stringify(d)};
  });
  return {rows,facts:{deliveryStatus:facts.deliveryStatus,historicalVatConfirmed:true,note:facts.note.trim()},action};
}
async function applyCorrectionBatch(batch){
  if(issuanceBusy||loadFailed||appClosing||!batch)return false;
  issuanceBusy=true;const previous=DB.reviewEvents||[];let saved=false;
  try{
    batch=JSON.parse(JSON.stringify(batch));
    const check=()=>{
      const fresh=buildCorrectionBatch(batch.rows.map(r=>r.id),batch.facts,batch.action);
      if(fresh.rows.some((r,i)=>r.sourceJSON!==batch.rows[i].sourceJSON))throw Error(tr('ข้อมูลเปลี่ยนแล้ว กรุณาเปิดตัวอย่างใหม่'));
      return fresh;
    };
    check();
    if(!window.billingAPI?.snapshotBackup)throw Error(tr('ต้องใช้แอปเดสก์ท็อปเพื่อสำรองก่อนแก้เป็นชุด'));
    if(!await window.billingAPI.snapshotBackup('before-bulk-correction'))throw Error(tr('สำรองหรือบันทึกไม่สำเร็จ ยังไม่เก็บผลตรวจ'));
    const fresh=check(),batchId=uid(),recordedAt=new Date().toISOString();
    const events=fresh.rows.map(r=>({id:uid(),type:'correction_review',documentId:r.id,batchId,recordedAt,
      ...fresh.facts,action:fresh.action,vatStatus:'non_registered',sourceRecordAtReview:JSON.parse(r.sourceJSON),
      ...(fresh.action==='prepare_proposal'?{proposal:{type:'receipt',status:'review_only',sourceDocumentId:r.id}}:{}),evidence:[]}));
    if(events.some(e=>!validCorrectionReviewEvent(e)))throw Error('DATA_SCHEMA_INVALID');
    DB.reviewEvents=[...previous,...events];
    if(!await persist(true))throw Error(tr('สำรองหรือบันทึกไม่สำเร็จ ยังไม่เก็บผลตรวจ'));
    saved=true;
    correctionPreview=null;correctionSelection.clear();closeModal();render();toast(tr('เก็บผลตรวจแล้ว ใบเดิมยังเหมือนเดิม'),'ok');return true;
  }catch(e){if(!saved)DB.reviewEvents=previous;toast(e.message||tr('สำรองหรือบันทึกไม่สำเร็จ ยังไม่เก็บผลตรวจ'),'err');return saved;}
  finally{issuanceBusy=false;}
}

function receiptReissueError(d){

  const raw={...d};delete raw.issuedSnapshot;const amounts=compute(raw);
  if(documentHasNumberConflict(d)||!d.number||![0,'0'].includes(d.vatRate)||d.currency!=='THB'||
    !validDocumentDate(d.issueDate)||!validDocumentDate(d.paidDate)||d.paidDate>todayISO()||
    !Array.isArray(d.items)||!d.items.length||d.items.some(i=>!i||!String(i.description||'').trim()||!Number.isFinite(Number(i.qty))||Number(i.qty)<=0||!Number.isFinite(Number(i.price))||Number(i.price)<0)||
    d.whtRate==null||d.whtRate===''||!Number.isFinite(Number(d.whtRate))||Number(d.whtRate)<0||Number(d.whtRate)>100||
    !reportAmountsValid(amounts)||amounts.netPayable<=0||amounts.grandTotal>Number.MAX_SAFE_INTEGER/100||
    (hasIssuedSnapshot(d)&&JSON.stringify(amounts)!==JSON.stringify(compute(d))))return tr('ข้อมูลไม่ครบหรือมีข้อขัดแย้ง ต้องตรวจแยก');

  if(!String(b.businessName||'').trim()||!String(b.address||'').trim()||!/^\d{13}$/.test(String(b.taxId||''))||

async function applyReceiptReissues(batch,facts){
  if(issuanceBusy||loadFailed||appClosing)return false;
  const previousEvents=DB.reviewEvents,previousCounters={...DB.counters};let saved=false;issuanceBusy=true;
  try{
    batch=JSON.parse(JSON.stringify(batch));facts=JSON.parse(JSON.stringify(facts));
    if(!facts||facts.historicalVatConfirmed!==true||facts.partyDetailsConfirmed!==true||facts.paymentFactsConfirmed!==true||typeof facts.note!=='string'||!facts.note.trim()||facts.note.length>4000)throw Error(tr('กรุณาเลือกรายการ ตรวจข้อมูล และยืนยันให้ครบ'));
    const check=()=>{
      if(!batch||batch.issueDate!==todayISO()||!Array.isArray(batch.rows))throw Error(tr('ข้อมูลเปลี่ยนแล้ว กรุณาเปิดตัวอย่างใหม่'));
      const fresh=buildReceiptReissueBatch(batch.rows.map(r=>r.id));
      if(JSON.stringify(fresh)!==JSON.stringify(batch))throw Error(tr('ข้อมูลเปลี่ยนแล้ว กรุณาเปิดตัวอย่างใหม่'));
    };
    check();if(!window.billingAPI?.snapshotBackup||!await window.billingAPI.snapshotBackup('before-receipt-reissue'))throw Error(tr('ยังไม่ออกฉบับแก้ไข สำรองหรือบันทึกไม่สำเร็จ'));
    check();const events=[];
    for(const row of batch.rows){
      const id=uid(),doc=receiptReissueDocument(row,batch.issueDate,id,null);delete doc.issuedSnapshot;
      if(!await assignSyncNumber(doc,'reviewEvent:'+id))throw Error(tr('เลขเอกสารซ้ำ กรุณาตรวจเอกสารที่เก็บไว้'));
      // Counters advance per row; reject collisions with earlier members of this same batch too.
      if(events.some(e=>e.receipt.number===doc.number))throw Error(tr('เลขเอกสารซ้ำ กรุณาตรวจเอกสารที่เก็บไว้'));
      const parties=JSON.parse(row.partiesJSON);internSnapshotImages(freezeIssuedDocument(doc,{...parties,docLang:doc.docLang,yearMode:parties.business.yearMode}));
      const event={id,type:'receipt_reissue',documentId:row.id,recordedAt:new Date().toISOString(),purpose:'document_correction_only',...facts,
        sourceRecordAtReview:JSON.parse(row.sourceJSON),receipt:doc,evidence:[]};
      if(!validReceiptReissueEvent(event))throw Error('DATA_SCHEMA_INVALID');events.push(event);
    }
    DB.reviewEvents=[...(previousEvents||[]),...events];
    if(!validReceiptReissueSet(DB)||!await persist(true))throw Error(tr('ยังไม่ออกฉบับแก้ไข สำรองหรือบันทึกไม่สำเร็จ'));
    saved=true;receiptReissuePreview=null;closeModal();viewDoc(events[0].receipt.id);toast(tr('ออกใบเสร็จฉบับแก้ไขแล้ว {n} ใบ').replace('{n}',events.length),'ok');return events;
  }catch(e){if(!saved){DB.reviewEvents=previousEvents;DB.counters=previousCounters;}toast(e.message||tr('ยังไม่ออกฉบับแก้ไข สำรองหรือบันทึกไม่สำเร็จ'),'err');return false;}
  finally{issuanceBusy=false;}
}

function legacyPaymentError(d,f){
  const t=d&&compute(d),party=p=>p&&typeof p.name==='string'&&p.name.trim()&&typeof p.address==='string'&&p.address.trim();
  return !d||d.type!=='invoice'||!isIssuedDocument(d)||!['sent','overdue'].includes(d.status)||!d.legacy_review_required||d.deletedAt||d.voidedAt||d.milestone||documentHasNumberConflict(d)||legacyPaymentExists(d)
    ||d.currency!=='THB'||Number(d.vatRate)!==0||DB.business.vatStatus!=='non_registered'||f.vatStatus!=='non_registered'||f.historicalVatConfirmed!==true
    ||!validDocumentDate(f.paidDate)||f.paidDate>todayISO()||f.fullPaymentConfirmed!==true||f.currency!=='THB'||!party(f.buyer)||!party(f.issuer)||!/^\d{13}$/.test(f.issuer.taxId||'')
    ||typeof f.note!=='string'||!f.note.trim()||!['gross','wht','net'].every(k=>typeof f[k]==='number'&&Number.isFinite(f[k]))
    ||f.gross<=0||f.wht<0||f.net<=0||round2(f.gross)!==t.grandTotal||round2(f.wht)!==t.whtAmount||round2(f.net)!==t.netPayable;
}
async function recordLegacyPayment(id,facts){
  if(issuanceBusy)return false;
  const f=JSON.parse(JSON.stringify(facts||{})),d=DB.documents.find(x=>x.id===id);
  issuanceBusy=true;
  try{if(legacyPaymentError(d,f)||!await verifyReviewEvidence(f.evidence)||legacyPaymentError(d,f)){toast(tr('ข้อมูลไม่ครบหรือมีรายการซ้ำ ต้องตรวจสอบก่อน'),'err');return false;}}
  finally{issuanceBusy=false;}
  const event={...f,sourceRecordAtReview:JSON.parse(JSON.stringify(d)),id:uid(),type:'legacy_payment',documentId:id,recordedAt:new Date().toISOString(),paymentId:uid()};
  if(!reviewedPaymentValid(event,d)){toast(tr('ข้อมูลไม่ครบหรือมีรายการซ้ำ ต้องตรวจสอบก่อน'),'err');return false;}
  if(!await appendReviewEvent(event))return false;toast(tr('บันทึกการรับเงินแยกจากเอกสารเดิมแล้ว'),'ok');return event;
}

async function createLegacyReceipt(id,eventId){
  if(issuanceBusy)return false;const source=DB.documents.find(d=>d.id===id),event=(DB.reviewEvents||[]).find(e=>e.id===eventId&&e.documentId===id&&e.type==='legacy_payment');
  if(!source||!event||source.voidedAt||source.deletedAt||source.type!=='invoice'||source.milestone||source.currency!=='THB'||Number(source.vatRate)!==0||documentHasNumberConflict(source)||DB.business.vatStatus!=='non_registered')return false;
  const existing=DB.documents.find(d=>(d.type==='receipt'||d.type==='tax_invoice')&&(d.parentId===id||d.paymentId===event.paymentId));if(existing){viewDoc(existing.id);return existing;}
  issuanceBusy=true;
  try{
    if(!await verifyReviewEvidence(event.evidence))return false;
    // Imported review events are untrusted: validate the complete supported payment facts again.
    const prior=DB.reviewEvents;DB.reviewEvents=prior.filter(e=>e.id!==event.id);
    let invalid;try{invalid=legacyPaymentError(source,event);}finally{DB.reviewEvents=prior;}
    if(invalid||!reviewedPaymentValid(event,source))return false;
    const reviewed=event.sourceRecordAtReview;
    if(!reviewed||JSON.stringify([reviewed.items,reviewed.currency,reviewed.vatRate,reviewed.whtRate])!==JSON.stringify([source.items,source.currency,source.vatRate,source.whtRate]))return false;
    const rec={id:uid(),type:'receipt',number:null,parentId:id,clientId:reviewed.clientId,paymentId:event.paymentId,reviewEventId:event.id,issueDate:todayISO(),paidDate:event.paidDate,status:'issued',currency:'THB',vatRate:0,whtRate:reviewed.whtRate,whtReviewed:true,fullPaymentConfirmed:true,items:JSON.parse(JSON.stringify(reviewed.items)),docLang:'bilingual',notes:reviewed.notes||'',incomeCategory:reviewed.incomeCategory||'',createdAt:new Date().toISOString(),deletedAt:null};
    const context={business:{...blankDB().business,businessName:event.issuer.name,address:event.issuer.address,taxId:event.issuer.taxId,vatStatus:'non_registered'},buyer:JSON.parse(JSON.stringify(event.buyer)),docLang:'bilingual',yearMode:DB.business.yearMode};
    if(!await persistDocumentMutation(rec,null,context))return false;viewDoc(rec.id);return rec;
  }finally{issuanceBusy=false;}
}
// A newly issued original keeps each business image once in DB.assets and refers to it by
// content hash, in both the frozen business copy and the archived HTML. Older originals keep
// their embedded copies untouched. An image outside the stored form simply stays embedded.
function internSnapshotImages(snapshot){
  for(const key of ['logo','signature','stamp']){
    // A correction issued from an original that already refers to a stored image reuses it.
    const value=snapshot.business[key],stored=/^asset:([a-f0-9]{64})$/.exec(String(value||''));
    const data=stored?(DB.assets||{})[stored[1]]:value;
    if(typeof data!=='string'||data.length>BillingData.ASSET_MAX||!BillingData.ASSET_DATA.test(data)) continue;
    const ref=stored?value:'asset:'+BillingData.sha256(data);
    DB.assets=DB.assets||{};DB.assets[ref.slice(6)]=data;
    snapshot.business[key]=ref;
    snapshot.renderedHtml=snapshot.renderedHtml.split(escapeHtml(data)).join(ref);
  }
}
function freezeIssuedDocument(d,sourceContext=null){
  if(hasIssuedSnapshot(d)) return d.issuedSnapshot;
  if(d.issuedSnapshot) throw new Error('Invalid issued snapshot requires review');
  if(d.legacy_review_required) throw new Error('Historical records require separately reviewed originals');
  const existing=d.id && DB.documents.find(x=>x.id===d.id);
  if(existing && isIssuedDocument(existing)) throw new Error('Cannot reconstruct an already issued original');
  const clone=v=>JSON.parse(JSON.stringify(v));
  const business=clone(sourceContext?sourceContext.business:DB.business), buyer=clone(sourceContext?sourceContext.buyer:clientById(d.clientId)||{});
  let lang=sourceContext?sourceContext.docLang:docLangOf(d);
  if((d.type==='receipt'||d.type==='tax_invoice') && lang==='en') lang='bilingual';
  const context={business,buyer,docLang:lang,yearMode:sourceContext?sourceContext.yearMode:business.yearMode,amounts:compute(d)};
  const snapshot={schemaVersion:1,version:1,issuedAt:new Date().toISOString(),business,buyer,
    document:clone(d),amounts:clone(context.amounts),docLang:context.docLang,yearMode:context.yearMode};
  snapshot.renderedHtml=renderPaper(d,buyer,context.amounts,context);
  snapshot.shareText=shareText(d,context);
  d.issuedSnapshot=snapshot;
  return snapshot;
}
async function voidDocument(id,reason){
  if(issuanceBusy) return false;
  const d=DB.documents.find(x=>x.id===id);
  if(!d || !isIssuedDocument(d) || d.voidedAt || d.type==='tax_invoice') return false;
  if(reason===undefined){openVoidDialog(id);return false;}
  if(reason===null) return false;
  if(!String(reason).trim()){ toast(tr('ต้องระบุเหตุผลที่ยกเลิก'),'err'); return false; }
  const original={...d};
  d.voidedAt=new Date().toISOString(); d.voidReason=String(reason).trim(); touch(d);
  issuanceBusy=true;
  try{if(!await persist(true)){restoreRecord(d,original);return false;}}
  catch(e){restoreRecord(d,original);return false;}finally{issuanceBusy=false;}
  closeModal();render(); toast(tr('เอกสารถูกยกเลิกและเก็บไว้แล้ว'),'ok'); return true;
}

/* ---------- shrink-to-fit (พิมพ์/บันทึก PDF) ----------
   เอกสารที่ยาวเกิน A4 หนึ่งหน้า "นิดเดียว" (หมายเหตุยาว/หลายรายการ) ต้องไม่หกไปหน้า 2 ที่แทบว่าง —
   วัดความสูงจริงที่ความกว้างงานพิมพ์ แล้วย่อทั้งใบด้วย zoom ให้พอดีหน้า (ต่ำสุด 70% —
   เอกสารที่ยาวจริง ๆ ปล่อยขึ้นหน้า 2 ตามธรรมชาติ ดีกว่าบีบจนอ่านไม่ออก) */
const PRINT_PAGE = { w:703, h:1032 };   // A4 210×297mm ลบขอบ @page 12mm รอบด้าน ที่ 96dpi
function computePrintZoom(){
  const paper = document.querySelector('.paper');
  if(!paper) return 1;
  const clone = paper.cloneNode(true);
  clone.style.cssText = 'position:absolute;left:-99999px;top:0;width:'+PRINT_PAGE.w+'px;max-width:none;'
    + 'padding:24px 26px;border:none;box-shadow:none;border-radius:0;animation:none;margin:0';
  document.body.appendChild(clone);
  const h = clone.getBoundingClientRect().height;
  clone.remove();
  if(h <= PRINT_PAGE.h) return 1;
  const z = PRINT_PAGE.h / h;   // z ที่วัดจากความกว้างเต็มเป็นค่า conservative — ย่อแล้วบรรทัดตัดน้อยลง ยิ่งเตี้ยลงอีก
  return z >= 0.7 ? z : 1;
}
function applyPrintZoom(){
  const d=currentView==='docview' ? getViewingDocument() : null;
  const blocked=!!d && documentOutputBlocked(d);
  document.body.classList.toggle('document-output-blocked',blocked);
  if(blocked){ document.body.setAttribute('data-print-blocked',documentBlockMessage(d)); return; }
  const z = computePrintZoom();
  if(z < 1) document.documentElement.style.setProperty('--paper-zoom', z.toFixed(3));
  else document.documentElement.style.removeProperty('--paper-zoom');
}
function clearPrintZoom(){ document.documentElement.style.removeProperty('--paper-zoom'); document.body.classList.remove('document-output-blocked'); }
function printDocument(){
  const d=getViewingDocument();
  if(documentOutputBlocked(d)){ toast(documentBlockMessage(d),'err'); return false; }
  applyPrintZoom();
  // Desktop prints through main so the page margins are white, not the app background.
  if(IS_ELECTRON && window.billingAPI.printDocument){ window.billingAPI.printDocument().catch(()=>{}).finally(clearPrintZoom); return true; }
  window.print(); return true;
}
// ครอบทุกช่องทางพิมพ์: ปุ่มพิมพ์/Cmd+P (beforeprint) และบันทึก PDF (printToPDF ไม่ยิง beforeprint)
window.addEventListener('beforeprint', applyPrintZoom);
window.addEventListener('afterprint', clearPrintZoom);

// Save the open document as a PDF file (desktop app only).
async function savePDF(){
  const d = getViewingDocument(); if(!d) return;
  if(documentOutputBlocked(d)){ toast(documentBlockMessage(d),'err'); return false; }
  const name = String(d.number||'document').replace(/[\/\\:*?"<>|]/g,'-')+'.pdf';
  try{
    applyPrintZoom();
    const p = await window.billingAPI.exportPDF(name);
    if(p){toast(tr('บันทึก PDF แล้ว:')+' '+baseName(p),'ok',null,'export');}
  }catch(e){ toast(tr('บันทึก PDF ไม่สำเร็จ'),'err'); }
  finally{ clearPrintZoom(); }
}
// Ready-to-paste summary for LINE/chat: what, how much, when, where to pay.
function shareText(d,issuanceContext=null){
  if(!issuanceContext && documentOutputBlocked(d)) return '';
  if(!issuanceContext && d.issuedSnapshot) return d.issuedSnapshot.shareText;
  const cl=issuanceContext?issuanceContext.buyer:clientById(d.clientId)||{};
  const t=issuanceContext?issuanceContext.amounts:compute(d), b=issuanceContext?issuanceContext.business:DB.business;
  // The message goes to the client, so it follows THEIR language, not the app UI language.
  const sl = (issuanceContext?issuanceContext.docLang:docLangOf(d))==='en' ? 'en' : 'th';
  const T = s => trFor(sl, s);
  const SD = ds => documentDate(ds,sl,b.yearMode);
  const cs=curSymOf(t.currency);
  const lines=[(d.status==='draft'?T('ร่าง')+' — ':'')+TYPE_LABEL[d.type][sl]+' '+d.number+(d.project?' — '+d.project:'')];
  if(cl.name) lines.push(T('เรียน {n}').replace('{n}',cl.name));
  lines.push('');
  if(d.type==='quotation'){
    lines.push(T('ยอดรวม: {a}').replace('{a}',cs+money(t.grandTotal)));
    if(t.whtRate>0) lines.push(T('(ยังไม่หักภาษี ณ ที่จ่าย {r}%)').replace('{r}',t.whtRate));
    lines.push(T('ยืนราคาถึง: {d}').replace('{d}',SD(addDays(d.issueDate,30))));
  }else if(d.type==='invoice'){
    lines.push(T('ยอดชำระสุทธิ: {a}').replace('{a}',cs+money(t.netPayable)));
    if(t.whtRate>0) lines.push(T('(ยอดรวม {a} หักภาษี ณ ที่จ่าย {r}% แล้ว)').replace('{a}',cs+money(t.grandTotal)).replace('{r}',t.whtRate));
    if(d.dueDate) lines.push(T('ครบกำหนดชำระ: {d}').replace('{d}',SD(d.dueDate)));
    if(t.currency==='THB' && b.promptpayId) lines.push(T('ชำระผ่าน PromptPay: {p}').replace('{p}',b.promptpayId));
    const bank=[b.bankName,b.bankAccountName,b.bankAccount].filter(Boolean).join(' · ');
    if(bank) lines.push(T('หรือโอนเข้าบัญชี: {b}').replace('{b}',bank));
  }else{
    lines.push(T('รับชำระแล้ว: {a}').replace('{a}',cs+money(t.netPayable)));
    if(d.paidDate) lines.push(T('วันที่รับชำระ: {d}').replace('{d}',SD(d.paidDate)));
    lines.push('');
    lines.push(T('ขอบคุณที่ใช้บริการ'));
  }
  return lines.join('\n');
}
async function copyShareText(){
  const d=getViewingDocument(); if(!d) return;
  if(documentOutputBlocked(d)){ toast(documentBlockMessage(d),'err'); return false; }
  const text=shareText(d);
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    // clipboard API can be blocked on file:// — fall back to execCommand
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(tr('คัดลอกข้อความแล้ว — วางส่งใน LINE ได้เลย'),'ok');
}
// Show the lineage: which document this was created from, and what it led to.
function docTrail(d){
  const parent = d.parentId ? DB.documents.find(x=>x.id===d.parentId) : null;
  const children = activeDocs().filter(x=>x.parentId===d.id);
  if(!parent && !children.length) return '';
  const chip = doc => `<a class="trail-chip" onclick="viewDoc(${jsArg(doc.id)})">${typeName(doc.type)}${doc.milestone?' · '+tr('งวดที่ {i}').replace('{i}',escapeHtml(doc.milestone.seq)):''} <b>${escapeHtml(doc.number)}</b></a>`;
  let parts=[];
  if(parent) parts.push(`<span class="trail-l">${tr('สร้างจาก')}</span>${chip(parent)}`);
  if(children.length) parts.push(`<span class="trail-l">${ic('arrowRight')} ${tr('นำไปออก')}</span>${children.map(chip).join('')}`);
  return `<div class="doc-trail">${parts.join('<span class="trail-sep"></span>')}</div>`;
}

          ${b.taxId?`${L('เลขประจำตัวผู้เสียภาษี','Tax ID')}: ${escapeHtml(b.taxId)}<br>`:''}
          ${b.phone?`${L('โทร.','Tel.')} ${escapeHtml(b.phone)}　`:''}${b.email?escapeHtml(b.email):''}
        </div>
      </div>

      ${showVat?`<div class="tr"><span class="l">${L('ภาษีมูลค่าเพิ่ม','VAT')} ${t.vatRate}%</span><span class="v">${money(t.vatAmount)}</span></div>`:''}
      <div class="tr grand"><span class="l">${L('ยอดรวมทั้งสิ้น','Grand total')}</span><span class="v">${cs}${money(t.grandTotal)}</span></div>

// "ชำระตามใบแจ้งหนี้ INV-… · งวดที่ 3/3 ของ QT-…" under the receipt title block; parts that do not exist are left out.
function settledReferenceHtml(s,L){
  if(!s || !s.invoiceNumber) return '';
  const inv=escapeHtml(s.invoiceNumber), qt=s.quotationNumber?escapeHtml(s.quotationNumber):'', ins=s.installment;
  const seq=ins?escapeHtml(ins.seq)+'/'+escapeHtml(ins.of):'';
  const th=`ชำระตามใบแจ้งหนี้ ${inv}`+(ins?` · งวดที่ ${seq}`+(qt?` ของ ${qt}`:''):qt?` · ตามใบเสนอราคา ${qt}`:'');
  const enTxt=`Payment for invoice ${inv}`+(ins?` · installment ${seq}`+(qt?` of ${qt}`:''):qt?` · per quotation ${qt}`:'');
  return `<div class="settled-reference">${L(th,enTxt)}</div>`;
}
// Issuer signature + company stamp, overlaid above a signature line.
function documentImageSource(value){
  // Embedded image data only: no remote tracking, attribute breakout or active URL.
  // "asset:<hash>" is an image this workspace stores once for its issued originals.
  const ref=/^asset:([a-f0-9]{64})$/.exec(String(value||''));
  const s=ref?String((DB.assets||{})[ref[1]]||''):String(value||'');
  return /^data:image\/(?:png|jpe?g|gif|webp|svg\+xml);base64,[a-z0-9+/=\s]+$/i.test(s)?escapeHtml(s):'';
}
function signMark(b){
  if(!b.signature && !b.stamp) return '';
  return `${documentImageSource(b.stamp)?`<img class="stamp" src="${documentImageSource(b.stamp)}">`:''}${documentImageSource(b.signature)?`<img class="sig" src="${documentImageSource(b.signature)}">`:''}`;
}

/* ---------- lifecycle actions ---------- */
async function setStatus(id,st,facts){
  if(issuanceBusy) return;
  const source=DB.documents.find(x=>x.id===id);
  if(!source || source.deletedAt || source.voidedAt || source.status==='void') return;
  if(source.legacy_review_required || (isIssuedDocument(source) && documentOutputBlocked(source))){toast(tr('เอกสารนี้ต้องตรวจประวัติก่อนเปลี่ยนสถานะ'),'err');return;}
  if(source.status===st) return;
  const allowed=source.type==='invoice'?['sent','paid']:source.type==='quotation'?['sent','accepted','declined']:[];
  if(!allowed.includes(st) || (isIssuedDocument(source) && !['paid','accepted','declined'].includes(st))) return;
  const d=JSON.parse(JSON.stringify(source));
  const error=issuanceError(d,true,d.issuedSnapshot); if(error){toast(error,'err');return;}
  if(st==='paid'){
    // ใบแจ้งหนี้งวด (milestone) รับชำระได้เหมือนใบปกติ — "เต็มจำนวน" หมายถึงเต็มยอดของใบนี้
    if(!isIssuedDocument(source)){toast(tr('ต้องมีใบแจ้งหนี้ที่ยืนยันรับเงินเต็มจำนวนแล้ว'),'err');return;}
    if(!facts){openPaymentDialog(id);return false;}
    const paidDate=facts.paidDate;
    if(!validDocumentDate(paidDate) || paidDate>todayISO() || !facts.fullPaymentConfirmed){toast(tr('กรุณายืนยันวันที่และการรับเงินเต็มจำนวน'),'err');return false;}
    d.paidDate=paidDate; d.fullPaymentConfirmed=true; d.paymentId=d.paymentId||uid();
  }
  d.status=st; issuanceBusy=true;
  try{if(await persistDocumentMutation(d,id)){closeModal();render();if(st==='paid'){toast(tr('บันทึกรับเงินแล้ว'),'ok',null,'payment');}return true;}return false;}finally{issuanceBusy=false;}
}
function convertToInvoice(id){
  const q=DB.documents.find(x=>x.id===id);
  if(!q || q.type!=='quotation' || q.deletedAt || q.voidedAt || (isIssuedDocument(q)&&documentOutputBlocked(q))) return;
  const original=q.issuedSnapshot?.document||q;
  openDocEditor('invoice',null,JSON.parse(JSON.stringify(original.items)),q.id,{
    clientId:original.clientId,project:original.project,notes:original.notes,currency:docCurrency(q),
    docLang:docLangOf(q),fxRate:original.fxRate||null,incomeCategory:original.incomeCategory||'',
    vatRate:original.vatRate,whtRate:original.whtRate
  });
}
async function createReceipt(id){
  if(issuanceBusy) return;
  const inv=DB.documents.find(x=>x.id===id);
  const existing=DB.documents.find(d=>(d.type==='receipt'||d.type==='tax_invoice') &&
    (d.parentId===id || (inv?.paymentId && d.paymentId===inv.paymentId)) && isIssuedDocument(d));
  if(existing){viewDoc(existing.id);return existing;}
  if(!inv || inv.type!=='invoice' || inv.status!=='paid' || inv.deletedAt || inv.voidedAt || !inv.paymentId ||
      !inv.fullPaymentConfirmed || !validDocumentDate(inv.paidDate) || !inv.whtReviewed || documentOutputBlocked(inv)){
    toast(tr('ต้องมีใบแจ้งหนี้ที่ยืนยันรับเงินเต็มจำนวนแล้ว'),'err');return;
  }
  const original=inv.issuedSnapshot.document;
  const rec={id:uid(),type:'receipt',number:null,clientId:original.clientId,parentId:inv.id,paymentId:inv.paymentId,
    issueDate:todayISO(),dueDate:null,paidDate:inv.paidDate,status:'issued',project:original.project,currency:docCurrency(inv),
    items:JSON.parse(JSON.stringify(original.items)),vatRate:original.vatRate,whtRate:original.whtRate,whtReviewed:true,
    fullPaymentConfirmed:true,docLang:docLangOf(inv)==='en'?'bilingual':docLangOf(inv),fxRate:original.fxRate||null,
    incomeCategory:original.incomeCategory||'',deletedAt:null,notes:original.notes,createdAt:new Date().toISOString(),
    whtCertReceived:inv.whtCertReceived===true,whtCertNo:inv.whtCertNo||'',whtCertDate:inv.whtCertDate||'',
    settles:settledReference(inv)};
  if(!await confirmNonVatInline() || issuanceBusy) return;
  const error=issuanceError(rec,true,inv.issuedSnapshot); if(error){toast(error,'err');return;}
  if(!await askConfirm(tr('ออกใบเสร็จเต็มจำนวนจากการรับเงินนี้?'),{confirmLabel:tr('ออกใบเสร็จรับเงิน')}) || issuanceBusy) return;
  issuanceBusy=true;
  try{
    if(!await persistDocumentMutation(rec,null,inv.issuedSnapshot))return;
    viewDoc(rec.id); toast(tr('ออกใบเสร็จแล้ว'),'ok',null,'issued');return rec;
  }finally{issuanceBusy=false;}
}
// ใบเสร็จธรรมดาพิมพ์ว่าชำระตามใบแจ้งหนี้ใบไหน (งวดที่/ใบเสนอราคา ถ้ามี) — เก็บลงเอกสารตอนออก
// จึงถูกแช่แข็งไปกับ issuedSnapshot ใบเสร็จที่ออกไปก่อนหน้าไม่มีช่องนี้และไม่เปลี่ยน
function settledReference(inv){
  const invDoc=inv.issuedSnapshot?.document||inv;
  const q=invDoc.parentId?DB.documents.find(x=>x.id===invDoc.parentId && x.type==='quotation'):null;
  const qDoc=q?(q.issuedSnapshot?.document||q):null, m=invDoc.milestone;
  const seq=Number(m&&m.seq), of=Number(m&&m.of);
  return {invoiceNumber:String(invDoc.number||inv.number||''),
    installment:Number.isInteger(seq)&&seq>0&&Number.isInteger(of)&&of>0?{seq,of}:null,
    quotationNumber:qDoc&&qDoc.number?String(qDoc.number):null};
}
function duplicateDoc(id){
  const src=DB.documents.find(x=>x.id===id);
  if(!src) return;
  if(src.type==='tax_invoice'){toast(tr('แอปนี้ออกใบเสร็จธรรมดาเท่านั้น ไม่ออกใบกำกับภาษี'),'err');return;}
  // Whitelist commercial content: never carry legal, payment or certificate identity.
  openDocEditor(src.type,null,JSON.parse(JSON.stringify(src.items)),null,{
    clientId:src.clientId,project:src.project,notes:src.notes,currency:docCurrency(src),docLang:docLangOf(src),
    fxRate:src.fxRate||null,incomeCategory:src.incomeCategory||'',vatRate:0,whtRate:src.whtRate,
    whtReviewed:false,fullPaymentConfirmed:false,paidDate:null,status:'draft',issueConfirmed:false
  });
}

/* ============================================================
   แบ่งงวด — split a quotation into milestone invoices
   ============================================================ */
function invoiceChildren(q){ return activeDocs().filter(x=> x.parentId===q.id && x.type==='invoice' && !x.voidedAt && x.status!=='void'); }
// billed = ยอดที่ออกใบแจ้งหนี้แล้ว, paid = ชำระแล้ว (หรือมีใบเสร็จลูกแล้ว) — เทียบกับยอดใบเสนอราคา
function splitProgress(q){
  const kids = invoiceChildren(q);
  const total = compute(q).grandTotal;
  let billed=0, paid=0,planned=0;
  kids.forEach(k=>{
    const g=compute(k).grandTotal;
    if(!Number.isFinite(g)||g<0) return;
    if(k.status==='draft'){planned+=g;return;}
    billed+=g;
    const hasReceipt = activeDocs().some(r=> r.parentId===k.id && (r.type==='receipt'||r.type==='tax_invoice') &&
      isIssuedDocument(r) && !r.voidedAt && r.status!=='void' && r.paymentId && r.paymentId===k.paymentId && hasIssuedSnapshot(r));
    if(effectiveStatus(k)==='paid' || hasReceipt) paid+=g;
  });
  billed=round2(billed); paid=round2(paid);planned=round2(planned);
  const remaining = Math.max(0, round2(total-billed));   // เศษสตางค์จาก VAT รายใบ — ต่ำกว่า 0.05 ถือว่าครบ
  return {kids, total, billed, paid,planned,remaining, fullyBilled: billed>0 && (total-billed)<0.05};
}
function renderSplitProgress(q){
  const p = splitProgress(q);
  if(!p.kids.length) return '';
  const cs = curSymOf(docCurrency(q));
  const pctPaid = p.total? Math.min(100, p.paid/p.total*100) : 0;
  const pctBilledOnly = p.total? Math.max(0, Math.min(100, p.billed/p.total*100) - pctPaid) : 0;
  return `<div class="split-progress">
    <div class="sp-head"><b>${tr('การแบ่งงวด')}</b>
      <span class="muted">${tr('{n} งวด').replace('{n}',p.kids.length)}${p.fullyBilled?' · '+tr('ออกใบแจ้งหนี้ครบแล้ว'):''}</span></div>
    <div class="sp-track">
      <div class="sp-paid" style="width:${pctPaid.toFixed(1)}%"></div>
      <div class="sp-billed" style="width:${pctBilledOnly.toFixed(1)}%"></div>
    </div>
    <div class="sp-stats">
      <span>${tr('ชำระแล้ว')} <b>${cs}${money(p.paid)}</b></span>
      <span>${tr('ออกบิลแล้ว')} <b>${cs}${money(p.billed)}</b></span>
      ${p.planned?`<span>${tr('ยอดร่างที่วางแผนไว้')} <b>${cs}${money(p.planned)}</b></span>`:''}
      ${p.remaining>=0.05?`<span>${tr('ยังไม่ออกบิล')} <b>${cs}${money(p.remaining)}</b></span>`:''}
    </div>
  </div>`;
}

// ความคืบหน้าของใบเสนอราคาที่แบ่งงวด — ตกลงเท่าไร รับแล้วกี่งวด ค้างเท่าไร
// นับจากใบเสร็จของใบแจ้งหนี้งวด (สาย parentId) ใบที่ยกเลิก/ลบไม่นับ; ยอดเป็นสุทธิหลังหัก ณ ที่จ่าย
function quotationProgress(q){
  const kids=invoiceChildren(q); if(!kids.length) return null;
  const ids=new Set(kids.map(k=>k.id));
  const receipts=activeDocs().filter(r=>(r.type==='receipt'||r.type==='tax_invoice') && ids.has(r.parentId) && isIssuedDocument(r) && !r.voidedAt && r.status!=='void');
  const agreed=compute(q).netPayable;
  const received=round2(receipts.reduce((s,r)=>{const n=compute(r).netPayable;return s+(Number.isFinite(n)?n:0);},0));
  return {agreed,received,outstanding:Math.max(0,round2(agreed-received)),receipts:receipts.length,installments:kids.length};
}
function renderQuotationProgress(q){
  const p=quotationProgress(q); if(!p||!Number.isFinite(p.agreed)) return '';
  const cur=docCurrency(q), amt=v=>`<b>${fmtMoneyC(v,cur)}</b>`;
  return `<div class="quotation-progress"><span>${tr('ตกลง {agreed} · รับแล้ว {received} ({count}) · ค้าง {outstanding}')
    .replace('{agreed}',()=>amt(p.agreed)).replace('{received}',()=>amt(p.received))
    .replace('{count}',()=>`${p.receipts}/${p.installments}`).replace('{outstanding}',()=>amt(p.outstanding))}</span></div>`;
}

let splitState=null;   // {qid, rows:[{label, amount, due}]} — แถวสุดท้ายไม่มี amount (ยอดคงเหลืออัตโนมัติ)
function splitBase(q){ return compute(q).subtotal; }   // แบ่งจากยอดก่อน VAT — แต่ละใบคำนวณ VAT/WHT ของตัวเอง
function openSplitDialog(qid){
  const q=DB.documents.find(x=>x.id===qid); if(!q) return;
  if(invoiceChildren(q).length){ toast(tr('ใบเสนอราคานี้แบ่งงวดแล้ว — ลบใบแจ้งหนี้งวดเดิมก่อนถ้าต้องการแบ่งใหม่'),'err'); return; }
  const base=splitBase(q);
  if(!(base>0)){ toast(tr('ยอดใบเสนอราคาเป็นศูนย์ — แบ่งงวดไม่ได้'),'err'); return; }
  // ป้ายชื่องวดพิมพ์ลงเอกสาร — ตั้งต้นตามภาษาเอกสาร ไม่ใช่ภาษา UI
  const enDoc = docLangOf(q)==='en';
  splitState={ qid, rows:[
    {label:enDoc?'Deposit':'มัดจำ', amount:round2(base*0.5), due:addDays(todayISO(),30)},
    {label:enDoc?'Delivery':'ส่งมอบงาน', amount:null, due:addDays(todayISO(),60)}
  ]};
  drawSplitDialog();
}
function splitPreset(pcts){
  const q=DB.documents.find(x=>x.id===splitState.qid); const base=splitBase(q);
  splitState.rows = pcts.map((p,i)=>({
    label: splitState.rows[i] ? splitState.rows[i].label : '',   // คำว่า "งวดที่ i/N" ใส่ให้อัตโนมัติอยู่แล้ว
    amount: i===pcts.length-1 ? null : round2(base*p/100),
    due: addDays(todayISO(), 30*(i+1))
  }));
  drawSplitDialog();
}
function splitAdd(){
  if(splitState.rows.length>=12) return;
  splitState.rows.splice(splitState.rows.length-1, 0, {label:'', amount:0, due:addDays(todayISO(),30*splitState.rows.length)});
  drawSplitDialog();
}
function splitDel(i){
  if(splitState.rows.length<=2) return;
  splitState.rows.splice(i,1);
  drawSplitDialog();
}
function splitUpd(i,k,v){
  const row=splitState.rows[i];
  if(k==='amount') row.amount=round2(Number(v)||0);
  else if(k==='pct'){ const q=DB.documents.find(x=>x.id===splitState.qid); row.amount=round2(splitBase(q)*(Number(v)||0)/100); }
  else row[k]=v;
  if(k==='amount'||k==='pct') drawSplitDialog();
}
function splitBalance(){
  const q=DB.documents.find(x=>x.id===splitState.qid);
  const others=splitState.rows.slice(0,-1).reduce((s,r)=>s+(Number(r.amount)||0),0);
  return round2(splitBase(q)-others);
}
function drawSplitDialog(){
  const q=DB.documents.find(x=>x.id===splitState.qid);
  const base=splitBase(q); const cs=curSymOf(docCurrency(q));
  const bal=splitBalance(); const n=splitState.rows.length;
  const pctOf=a=> base? (a/base*100) : 0;
  const rowsHtml=splitState.rows.map((r,i)=>{
    const last=i===n-1;
    const amt=last? bal : (Number(r.amount)||0);
    return `<tr>
      <td class="muted">${i+1}</td>
      <td><input type="text" value="${attr(r.label)}" placeholder="${attr(tr('เช่น มัดจำ / ส่งมอบงาน / ตรวจรับ'))}" onchange="splitUpd(${i},'label',this.value)"></td>
      <td class="num-col">${last
        ? `<span class="bal">${pctOf(amt).toFixed(1)}%</span>`
        : `<input type="number" min="0" max="100" step="0.1" value="${pctOf(amt).toFixed(1)}" onchange="splitUpd(${i},'pct',this.value)">`}</td>
      <td class="amt-col">${last
        ? `<span class="bal">${cs}${money(amt)}</span>`
        : `<input type="number" min="0" step="0.01" value="${amt}" onchange="splitUpd(${i},'amount',this.value)">`}</td>
      <td class="date-col"><input type="date" value="${attr(r.due||'')}" onchange="splitUpd(${i},'due',this.value)"></td>
      <td>${n>2?`<button class="btn btn-sm" onclick="splitDel(${i})">${ic('trash',13)}</button>`:''}</td>
    </tr>`;
  }).join('');
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div class="modal-head"><h3>${tr('แบ่งงวด')} — ${escapeHtml(q.number)}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">${ic('close')}</button></div>
    <div class="modal-body">
      <div class="muted" style="font-size:12px;margin-bottom:10px">${tr('ยอดก่อน VAT {a} — งวดสุดท้ายปรับยอดให้ครบอัตโนมัติ แต่ละงวดจะคิด VAT/หัก ณ ที่จ่าย ของตัวเอง').replace('{a}',cs+money(base))}</div>
      <div class="pill-select" style="margin-bottom:12px">
        <button onclick="splitPreset([50,50])">50/50</button>
        <button onclick="splitPreset([30,40,30])">30/40/30</button>
        <button onclick="splitPreset([100/3,100/3,100/3])">${tr('3 งวดเท่ากัน')}</button>
        <button onclick="splitPreset([25,25,25,25])">${tr('4 งวดเท่ากัน')}</button>
      </div>
      <table class="split-rows">
        <tr><th>#</th><th>${tr('ชื่องวด (ตาม TOR)')}</th><th>%</th><th>${tr('จำนวนเงิน')}</th><th>${tr('ครบกำหนด')}</th><th></th></tr>
        ${rowsHtml}
      </table>
      <button class="btn btn-sm" style="margin-top:10px" onclick="splitAdd()">${ic('plus',13)} ${tr('เพิ่มงวด')}</button>
      ${bal<0.005?`<div class="banner danger" role="alert" style="margin-top:10px">${ic('alert')} ${tr('ยอดงวดก่อนหน้ารวมเกินยอดใบเสนอราคา — ลดยอดบางงวดลง')}</div>`:''}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">${tr('ยกเลิก')}</button>
      <button class="btn btn-primary" onclick="saveSplit()">${ic('arrowRight')} ${tr('สร้างใบแจ้งหนี้ {n} งวด').replace('{n}',n)}</button>
    </div>`;
  openModal();
}
function saveSplit(){
  const q=DB.documents.find(x=>x.id===splitState.qid);
  const bal=splitBalance();
  const amounts=[...splitState.rows.slice(0,-1).map(r=>round2(Number(r.amount)||0)), bal];
  if(amounts.some(a=> !(a>0))){ toast(tr('ทุกงวดต้องมียอดมากกว่าศูนย์'),'err'); return; }
  splitQuotation(q, splitState.rows.map((r,i)=>({label:(r.label||'').trim(), amount:amounts[i], due:r.due||null})));
}
async function splitQuotation(q, rows){
  if(issuanceBusy) return false;
  q=q && DB.documents.find(d=>d.id===q.id);
  if(!q || q.type!=='quotation' || q.deletedAt || q.voidedAt || (isIssuedDocument(q)&&documentOutputBlocked(q)) ||
      !Array.isArray(rows) || rows.length<2 || rows.length>12 || rows.some(r=>!r || !Number.isFinite(Number(r.amount)) || Number(r.amount)<=0 || !validDocumentDate(r.due))) return false;
  if(Math.abs(round2(rows.reduce((sum,row)=>sum+Number(row.amount),0))-splitBase(q))>0.005) return false;
  const original=q.issuedSnapshot?.document||q;
  const previousDocuments=DB.documents.slice(), previousCounters={...DB.counters};
  const N=rows.length;
  const lang=docLangOf(q);                         // คำบรรยายงวดพิมพ์ลงกระดาษ — ตามภาษาเอกสาร ไม่ใช่ภาษา UI
  issuanceBusy=true;
  try{
  rows.forEach((r,idx)=>{
    const i=idx+1;
    const th=`งวดที่ ${i}/${N}${r.label?' — '+r.label:''} · อ้างอิง ${q.number}`;
    const en=`Installment ${i}/${N}${r.label?' — '+r.label:''} · ref ${q.number}`;
    const bi=`งวดที่ ${i}/${N} (Installment ${i}/${N})${r.label?' — '+r.label:''} · อ้างอิง/ref ${q.number}`;
    const description = lang==='en' ? en : lang==='bilingual' ? bi : th;
    const inv={
      id:uid(), type:'invoice', number:null,
      clientId:original.clientId, parentId:q.id, issueDate:todayISO(), dueDate:r.due,
      paidDate:null, status:'draft', project:original.project, currency:docCurrency(q),
      items:[{description, qty:1, unit: lang==='en'?'installment':'งวด', price:r.amount}],
      vatRate:original.vatRate, whtRate:original.whtRate,whtReviewed:false,fullPaymentConfirmed:false,
      docLang:lang, fxRate:original.fxRate||null,
      incomeCategory:original.incomeCategory||'', deletedAt:null,
      notes:original.notes, milestone:{seq:i, of:N, label:r.label},
      createdAt:new Date().toISOString()
    };
    touch(inv);
    const error=issuanceError(inv,false); if(error) throw new Error(error);
    if(!uniqueDocumentNumber(inv)) throw new Error(tr('เลขเอกสารซ้ำ กรุณาตรวจเอกสารที่เก็บไว้'));
    DB.documents.push(inv);
  });
  if(!await persist(true)) throw new Error(tr('บันทึกไม่สำเร็จ ยังไม่ได้ออกเอกสาร'));
  splitState=null; closeModal(); viewDoc(q.id);
  toast(tr('สร้างใบแจ้งหนี้ {n} งวดแล้ว').replace('{n}',N),'ok');
  return true;
  }catch(error){DB.documents=previousDocuments;DB.counters=previousCounters;toast(error.message,'err');return false;}
  finally{issuanceBusy=false;}
}

/* ---------- in-app confirmation ----------
   Thai-labelled, names the action, destructive actions in red with Cancel focused.
   Non-browser test harnesses fall back to their stubbed window.confirm. */
let confirmResolve=null, confirmReturnFocus=null;
function askConfirm(message,opts={}){
  const layer=document.getElementById('confirmOverlay');
  const msg=layer && layer.querySelector && layer.querySelector('#confirmMsg');
  if(!msg || !document.querySelector){
    return Promise.resolve(typeof confirm==='function' ? confirm(opts.detail ? message+'\n\n'+opts.detail : message) : false);
  }
  if(confirmResolve) settleConfirm(false);
  confirmReturnFocus=document.activeElement;
  msg.textContent=message;
  layer.querySelector('#confirmDetail').textContent=opts.detail||'';
  const ok=layer.querySelector('#confirmOk'), cancel=layer.querySelector('#confirmCancel');
  ok.textContent=opts.confirmLabel||tr('ยืนยัน'); cancel.textContent=tr('ยกเลิก');
  ok.className='btn '+(opts.danger?'btn-danger-solid':'btn-primary');
  layer.classList.add('open');
  setAppInert(true); document.getElementById('overlay').inert=true; document.getElementById('cmdkOverlay').inert=true;
  (opts.danger?cancel:ok).focus({preventScroll:true});
  return new Promise(resolve=>{ confirmResolve=resolve; });
}
function settleConfirm(result){
  if(!confirmResolve) return;
  const resolve=confirmResolve; confirmResolve=null;
  document.getElementById('confirmOverlay').classList.remove('open');
  document.getElementById('overlay').inert=false; document.getElementById('cmdkOverlay').inert=false;
  if(!modalIsOpen() && !cmdkOpen) setAppInert(false);
  const back=confirmReturnFocus; confirmReturnFocus=null;
  if(back && back.isConnected && back.focus) back.focus({preventScroll:true});
  resolve(result===true);
}
// Escape cancels the confirmation only (capture phase, before the dialog/Escape handlers).
document.addEventListener('keydown',e=>{
  if(!confirmResolve) return;
  if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); settleConfirm(false); }
  // HIG alerts: Return chooses the default button — never a destructive one the person did not deliberately pick.
  if(e.key==='Enter' && !e.isComposing){
    const ok=document.getElementById('confirmOk');
    if(ok && !ok.classList.contains('btn-danger-solid') && document.activeElement!==document.getElementById('confirmCancel')){ e.preventDefault(); e.stopImmediatePropagation(); settleConfirm(true); }
  }
},true);
let modalReturnFocus=null;
function setAppInert(on){ const app=document.querySelector && document.querySelector('.app'); if(app) app.inert=on; }
function focusModal(){
  const m=document.getElementById('modal');
  if(!m.querySelector || !m.setAttribute || !m.removeAttribute || !m.focus) return;   // non-browser harnesses
  const h=m.querySelector('.modal-head h3');
  if(h){ h.id='modalTitle'; m.setAttribute('aria-labelledby','modalTitle'); } else m.removeAttribute('aria-labelledby');
  const first=m.querySelector('.modal-body input:not([type=hidden]):not([disabled]),.modal-body select:not([disabled]),.modal-body textarea');
  (first||m).focus({preventScroll:true});
}
function openModal(){
  const ov=document.getElementById('overlay');
  const wasOpen=!!(ov.classList.contains && ov.classList.contains('open'));
  ov.classList.add('open');
  if(!document.querySelector) return;
  if(!wasOpen){ modalReturnFocus=document.activeElement; setAppInert(true); }
  focusModal();
}
function closeModal(){
  const recoverable=editDoc&&editDocDirty?JSON.parse(JSON.stringify(editDoc)):null;
  if(recoverable&&!autoSaveDraft())return false;
  const wasEditor=!!editDoc;editDoc=null;if(wasEditor)clearDraft(!recoverable&&!pendingEditorDraft);
  pendingEditorDraft=null;
  if(document.getElementById('c_name'))pendingNewDocType=null;
  if(recoverable){
    toast(tr('เก็บงานที่ยังไม่บันทึกไว้แล้ว'),'ok',{label:tr('เปิดกลับ'),run:()=>{openDocEditor(recoverable.type,recoverable.id);if(pendingEditorDraft)restoreEditorDraft();}});
  }
  const ov=document.getElementById('overlay');
  const wasOpen=!!(ov.classList.contains && ov.classList.contains('open'));
  ov.classList.remove('open'); document.getElementById('modal').innerHTML='';
  if(wasOpen && document.querySelector){
    const cmdkOverlay=document.getElementById('cmdkOverlay');
    if(!(cmdkOverlay.classList && cmdkOverlay.classList.contains('open'))) setAppInert(false);
    const back=modalReturnFocus; modalReturnFocus=null;
    if(back && back.isConnected && back.focus) back.focus({preventScroll:true});
  }
}
document.getElementById('overlay').addEventListener('mousedown',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||confirmResolve) return;
  const m=document.getElementById('modal'),t=e.target;
  if(!modalIsOpen()||!m||!t||!t.matches||!m.contains(t)) return;
  if(!t.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color])')) return;
  if(m.querySelector('#itemsBody')) return;   // document editor: Enter must not issue/save
  const primary=m.querySelectorAll('.modal-foot .btn-primary');
  if(primary.length!==1||primary[0].disabled) return;
  e.preventDefault(); primary[0].click();
});

/* ---------- Inline validation helpers ---------- */
function validateThaiTaxId(id){
  if(!id||id.length!==13) return null;
  if(!/^\d{13}$/.test(id)) return false;
  let sum=0;
  for(let i=0;i<12;i++) sum+=parseInt(id[i])*(13-i);
  return (11-sum%11)%10===parseInt(id[12]);
}
function taxIdFeedback(val,finished){
  const el=document.getElementById('taxIdFeedback');
  if(!el) return;
  const s=String(val||'').trim();
  // Partial digits stay quiet while typing; letters, or a short number on leaving the field, are flagged.
  const r=!s ? null : s.length===13 ? validateThaiTaxId(s) : (/^\d{1,12}$/.test(s) && !finished ? null : false);
  if(r===null){el.textContent='';el.className='';return;}
  el.innerHTML=ic(r?'check':'close',14)+' '+escapeHtml(tr(r?'เลขประจำตัวผู้เสียภาษีถูกต้อง':'เลขประจำตัวผู้เสียภาษีไม่ถูกต้อง'));
  el.className=r?'taxid-valid':'taxid-invalid';
}
function hintIcon(text){

}

/* ---------- Command palette (Cmd+K) + keyboard shortcuts ---------- */
let cmdkOpen=false, cmdkSelected=0, cmdkItems=[];
let cmdkReturnFocus=null;
function modalIsOpen(){ const ov=document.getElementById('overlay'); return !!(ov.classList.contains && ov.classList.contains('open')); }
function openCmdk(){
  if(modalIsOpen()) return;
  cmdkOpen=true; cmdkSelected=0; cmdkReturnFocus=document.activeElement;
  document.getElementById('cmdkOverlay').classList.add('open'); setAppInert(true);
  const inp=document.getElementById('cmdkInput'); inp.value=''; inp.focus();
  cmdkRenderResults('');
}
function closeCmdk(){
  if(!cmdkOpen) return;
  cmdkOpen=false;
  document.getElementById('cmdkOverlay').classList.remove('open');
  if(!modalIsOpen()) setAppInert(false);
  const back=cmdkReturnFocus; cmdkReturnFocus=null;
  if(back && back.isConnected && back.focus && !modalIsOpen()) back.focus({preventScroll:true});
}
function cmdkRenderResults(q){
  q=(q||'').toLowerCase().trim();
  const actions=[
    {icon:'plus',label:tr('สร้างใบเสนอราคา'),type:tr('คำสั่ง'),action:()=>{closeCmdk();openDocEditor('quotation');}},
    {icon:'plus',label:tr('สร้างใบแจ้งหนี้'),type:tr('คำสั่ง'),action:()=>{closeCmdk();openDocEditor('invoice');}},
    {icon:'plus',label:tr('สร้างใบเสร็จ'),type:tr('คำสั่ง'),action:()=>{closeCmdk();openDocEditor('receipt');}},
    {icon:'users',label:tr('ดูลูกค้า'),type:tr('ไปที่'),action:()=>{closeCmdk();navTo('clients');}},
    {icon:'barChart',label:tr('ดูสรุปรายรับ'),type:tr('ไปที่'),action:()=>{closeCmdk();navTo('report');}},
    {icon:'fileText',label:tr('ดูเอกสารทั้งหมด'),type:tr('ไปที่'),action:()=>{closeCmdk();navTo('documents');}},
    {icon:'scissors',label:tr('ดูหัก ณ ที่จ่าย'),type:tr('ไปที่'),action:()=>{closeCmdk();navTo('wht');}},
    {icon:'settings',label:tr('ตั้งค่า'),type:tr('ไปที่'),action:()=>{closeCmdk();navTo('settings');}},
  ];
  const docIcon=d=>d.type==='quotation'?'fileText':d.type==='invoice'?'clock':'receipt';
  let items=[];
  if(q){
    // Search documents
    const docs=activeDocs().filter(d=>{
      const cl=clientById(d.clientId);
      return (d.number||'').toLowerCase().includes(q)||(cl&&cl.name.toLowerCase().includes(q))||(d.project||'').toLowerCase().includes(q);
    }).slice(0,8);
    items=docs.map(d=>{
      const cl=clientById(d.clientId);
      return {icon:docIcon(d),label:d.number||tr('ร่าง'),sub:cl?cl.name:'',type:typeName(d.type),action:()=>{closeCmdk();viewDoc(d.id);}};
    });
    // Filter actions
    const filtered=actions.filter(a=>a.label.toLowerCase().includes(q));
    items=[...items,...filtered];
  }else{
    // Default: recent docs + actions
    const recent=[...activeDocs()].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,4);
    items=[
      ...recent.map(d=>{const cl=clientById(d.clientId);return{icon:docIcon(d),label:d.number||tr('ร่าง'),sub:cl?cl.name:'',type:tr('ล่าสุด'),action:()=>{closeCmdk();viewDoc(d.id);}};}),
      ...actions.slice(0,5),
    ];
  }
  cmdkItems=items;
  const el=document.getElementById('cmdkResults');
  if(!items.length){el.innerHTML=`<div class="cmdk-empty">${tr('ไม่พบผลลัพธ์')}</div>`;cmdkSelected=0;cmdkSyncActive();return;}
  cmdkSelected=Math.min(cmdkSelected,items.length-1);
  el.innerHTML=items.map((it,i)=>`<div class="cmdk-item${i===cmdkSelected?' active':''}" id="cmdk-opt-${i}" role="option" aria-selected="${i===cmdkSelected}" data-i="${i}" onclick="cmdkExecute(${i})">
    <span class="cmdk-ic" aria-hidden="true">${ic(it.icon,16)}</span><div><div>${escapeHtml(it.label)}</div>${it.sub?`<div class="cmdk-sub">${escapeHtml(it.sub)}</div>`:''}</div><span class="cmdk-type">${escapeHtml(it.type||'')}</span></div>`).join('');
  cmdkSyncActive();
}
function cmdkSyncActive(){
  const inp=document.getElementById('cmdkInput'), opt=document.getElementById('cmdk-opt-'+cmdkSelected);
  if(inp && inp.setAttribute) inp.setAttribute('aria-activedescendant', opt ? opt.id : '');
  if(opt && opt.scrollIntoView) opt.scrollIntoView({block:'nearest'});
}
function cmdkExecute(i){
  const it=cmdkItems[i]; if(it&&it.action) it.action();
}
document.addEventListener('keydown',e=>{
  const meta=e.metaKey||e.ctrlKey;
  if(meta&&e.key==='k'){e.preventDefault();cmdkOpen?closeCmdk():openCmdk();return;}
  if(meta&&e.key==='n'){e.preventDefault();if(!modalIsOpen()&&!cmdkOpen)openDocEditor('quotation');return;}
  if(cmdkOpen){
    if(e.key==='Escape'){e.preventDefault();closeCmdk();return;}
    if(e.key==='ArrowDown'){e.preventDefault();cmdkSelected=Math.min(cmdkSelected+1,cmdkItems.length-1);cmdkRenderResults(document.getElementById('cmdkInput').value);return;}
    if(e.key==='ArrowUp'){e.preventDefault();cmdkSelected=Math.max(cmdkSelected-1,0);cmdkRenderResults(document.getElementById('cmdkInput').value);return;}
    if(e.key==='Enter'){e.preventDefault();cmdkExecute(cmdkSelected);return;}
    // Type to search
    setTimeout(()=>cmdkRenderResults(document.getElementById('cmdkInput').value),0);
  }
});

function attr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

/* ---------- accessibility: labels, keyboard access, menus ----------
   Templates stay compact; this pass links visible labels to their controls and
   makes clickable rows/cards keyboard-operable after every render. */
let a11yQueued=false, a11ySeq=0;
function a11yEnhance(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll('.field').forEach(f=>{
    const label=[...f.children].find(el=>el.tagName==='LABEL' && !el.classList.contains('toggle'));
    if(!label || label.htmlFor || label.querySelector('input,select,textarea')) return;
    const control=f.querySelector('input:not([type=hidden]),select,textarea'); if(!control) return;
    if(!control.id) control.id='fld-'+(++a11ySeq);
    label.htmlFor=control.id;
  });
  root.querySelectorAll('table').forEach(table=>{
    const heads=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    table.querySelectorAll('tbody tr').forEach(row=>[...row.children].forEach((cell,i)=>{
      cell.querySelectorAll('input,select').forEach(el=>{ if(heads[i] && !el.getAttribute('aria-label') && !(el.labels&&el.labels.length)) el.setAttribute('aria-label',heads[i]); });
    }));
  });
  root.querySelectorAll('input[placeholder]:not([aria-label])').forEach(el=>{ if(!(el.labels&&el.labels.length)) el.setAttribute('aria-label',el.placeholder); });
  root.querySelectorAll('.year-pick select:not([aria-label])').forEach(el=>el.setAttribute('aria-label',tr('ปีภาษี')));
  root.querySelectorAll('button.x:not([aria-label])').forEach(b=>b.setAttribute('aria-label',tr('ปิด')));
  root.querySelectorAll('.items-table .del:not([aria-label])').forEach(b=>b.setAttribute('aria-label',tr('ลบรายการ')));
  root.querySelectorAll('button[title]:not([aria-label])').forEach(b=>{ if(!b.textContent.trim()) b.setAttribute('aria-label',b.title); });
  // Native date pickers follow the OS (Christian year); show the app's own reading beneath them.
  root.querySelectorAll('.field input[type=date]').forEach(input=>{
    let box=input.nextElementSibling;
    if(!(box && box.classList.contains('date-preview'))){
      box=document.createElement('div'); box.className='hint date-preview'; input.after(box);
    }
    syncDatePreview(input);
  });
  root.querySelectorAll('tbody tr[onclick]:not([tabindex]), .client-card:not([tabindex])').forEach(el=>{
    el.tabIndex=0; if(el.classList.contains('client-card')) el.setAttribute('role','button');
  });
}
function syncDatePreview(input){
  const box=input && input.nextElementSibling;
  if(!box || !box.classList || !box.classList.contains('date-preview')) return;
  const text = DB && DB.business.yearMode==='be' && validDocumentDate(input.value) ? '= '+fmtDate(input.value,true) : '';
  if(box.textContent!==text) box.textContent=text;
}
for(const eventName of ['input','change']) document.addEventListener(eventName,e=>{
  if(e.target && e.target.type==='date') syncDatePreview(e.target);
});
function queueA11y(){
  if(a11yQueued) return; a11yQueued=true;
  queueMicrotask(()=>{ a11yQueued=false; a11yEnhance(document.getElementById('content')); a11yEnhance(document.getElementById('modal')); });
}
if(typeof MutationObserver!=='undefined' && typeof queueMicrotask!=='undefined'){
  const a11yObserver=new MutationObserver(queueA11y);
  ['content','modal'].forEach(id=>{ const el=document.getElementById(id); if(el && el.nodeType===1) a11yObserver.observe(el,{childList:true,subtree:true}); });
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  // Desktop app: load from the native store and we're done.
  if(IS_ELECTRON){
    try{ DEVICE_ID = await window.billingAPI.deviceId(); }catch(e){ DEVICE_ID = browserDeviceId(); }
    let raw = null;
    try{ raw = await window.billingAPI.load(); }catch(e){ loadFailed = true; loadErrorCode=String(e.message).match(/DATA_[A-Z_]+/)?.[0]||''; }
    if(raw !== null){
      // A data file EXISTS — if it won't parse, never autosave a blank DB over it.
      try{
        const parsed = JSON.parse(raw);
        // อัปเกรดสคีมา v1 → v2: เก็บสำเนาไฟล์เดิมไว้ก่อนเสมอ (ไฟล์มีป้าย ไม่ถูกลบวนอัตโนมัติ)
        if((parsed.version||1) < 2 && window.billingAPI.snapshotBackup){
          try{ await window.billingAPI.snapshotBackup('pre-v2'); }catch(e){}
        }
        adoptDatabase(parsed);
      }
      catch(e){ loadFailed = true; loadErrorCode=String(e.message).match(/DATA_[A-Z_]+/)?.[0]||''; }
    }
    if(!DB) DB = blankDB();
    buildJournalIndex();   // baseline ของ journal — เริ่มนับความเปลี่ยนแปลงจากสถานะนี้
    try{ if(window.billingAPI.licenseStatus) PRO = await window.billingAPI.licenseStatus(); }catch(e){}
    // MAS: การซื้อ/กู้คืนสำเร็จมาจาก StoreKit แบบ async — อัปเดตสถานะ Pro ทันทีที่ transaction จบ
    if(IS_MAS && window.billingAPI.onIapChanged){
      window.billingAPI.onIapChanged(handleIapChanged);
      // Recover a transaction delivered before the renderer finished booting.
      if(window.billingAPI.iapStatus) await handleIapChanged(await window.billingAPI.iapStatus());
    }
    await refreshSyncInfo();
    if(isSyncEnabled()) setTimeout(()=>syncNow(true), 4000);        // ดึงงานจากเครื่องอื่นหลังเปิดแอป
    // ตัวจับเวลา/โฟกัสลงทะเบียนเสมอ — เผื่อเปิด Pro/เชื่อม Drive ระหว่างใช้งาน (เช็คเงื่อนไขตอนยิง)
    window.addEventListener('focus', ()=>{ if(isSyncEnabled() && !syncBusy) syncNow(true); });
    setInterval(()=>{ if(isSyncEnabled()) syncNow(true); }, 5*60*1000);
    try{ dataLoc = await window.billingAPI.where(); }catch(e){}
    if(window.billingAPI.onMenuExport) window.billingAPI.onMenuExport(()=>elExport());
    if(window.billingAPI.onMenuImport) window.billingAPI.onMenuImport(()=>elImport());
    // Stop new input, finish local transactions; main also drains the native disk queue.
    let closeRequest=null;
    if(window.billingAPI.onQuitCancelled)window.billingAPI.onQuitCancelled((_event,request)=>{
      if(request?.requestId===closeRequest){closeRequest=null;appClosing=false;document.body.inert=false;}
    });
    if(window.billingAPI.onQuitFlush) window.billingAPI.onQuitFlush(async (_event,request)=>{
      if(!autoSaveDraft() || !captureLegacyDraft()){window.billingAPI.quitFlushDone({requestId:request.requestId,ok:false});return;}
      closeRequest=request?.requestId;appClosing=true;settleConfirm(false);document.body.inert=true;clearTimeout(syncTimer);
      const deadline=Date.now()+12000;
      while((issuanceBusy||pendingPersist)&&Date.now()<deadline)await new Promise(resolve=>setTimeout(resolve,25));
      window.billingAPI.quitFlushDone({requestId:request?.requestId,ok:!dirty&&!issuanceBusy&&pendingPersist===0});
    });
    applyTheme();
    updateFileStatus();
    setView('dashboard');
    if(!loadFailed && !DB.meta.setupDone && !DB.business.businessName && !activeDocs().length) openWizard();
    return;
  }

  // 1) Show cached data immediately so the UI is never empty.
  DEVICE_ID = browserDeviceId();
  const cached = loadLocal();
  // เก็บสำเนา v1 ไว้หนึ่งชุดก่อนอัปเกรดสคีมา (กู้มือจาก localStorage ได้ถ้าจำเป็น)
  if(cached && (cached.version||1) < 2){ try{ localStorage.setItem(LS_KEY+'_prev2', JSON.stringify(cached)); }catch(e){} }
  adoptDatabase(cached || blankDB());
  applyTheme();
  updateFileStatus();
  setView('dashboard');

  // 2) Try to reconnect the billing.json from a previous session (source of truth).
  if(supportsFSA){
    try{
      const h = await idbGet(HANDLE_KEY);
      if(h){
        const perm = await h.queryPermission({mode:'readwrite'});
        if(perm==='granted'){
          fileHandle = h;
          await loadFromHandle();   // file overrides the cache
          render();
        }else{
          // Browser needs a click to re-grant file access (common on file:// pages).
          pendingHandle = h;
        }
        updateFileStatus();
      }
    }catch(e){/* no saved handle */}
  }

  // First run in the browser too — but only when no saved file might still load.
  if(!fileHandle && !pendingHandle && !DB.meta.setupDone && !DB.business.businessName && !activeDocs().length) openWizard();

  window.addEventListener('beforeunload',e=>{ if(dirty && fileHandle){ e.preventDefault(); e.returnValue=''; } });
}
// Show the right shortcut for the platform in the sidebar search button.
(()=>{ const k=document.getElementById('cmdkKey'); const mac=typeof navigator!=='undefined' && /Mac/i.test(navigator.platform||''); if(k && !mac) k.textContent='Ctrl K';
  // macOS desktop window: hidden title bar + sidebar vibrancy (main.js). The CSS insets the traffic lights.
  if(mac && window.billingAPI && window.billingAPI.isElectron && !window.billingAPI.isMobile && document.documentElement && document.documentElement.classList) document.documentElement.classList.add('mac-window');
  // Toolbar scroll-edge effect: a hairline appears only once content scrolls beneath it.
  const bar=document.querySelector?document.querySelector('.topbar'):null;
  if(bar && bar.classList && window.addEventListener) window.addEventListener('scroll',()=>bar.classList.toggle('scrolled',window.scrollY>4),{passive:true});
  // OS appearance change: mirror it as html.scheme-dark so every token-driven background recomputes at once
  // (Chromium can leave a composited container painted with the previous scheme's var() value).
  if(window.matchMedia && document.documentElement && document.documentElement.classList){
    const mq=window.matchMedia('(prefers-color-scheme: dark)'),sync=()=>document.documentElement.classList.toggle('scheme-dark',mq.matches);
    sync(); if(mq.addEventListener) mq.addEventListener('change',sync); } })();
// paint the static sidebar nav icons
document.querySelectorAll('.sidebar .ico[data-ic], .cmdk .ico[data-ic]').forEach(s=> s.innerHTML = ic(s.dataset.ic,18));
boot();
</script>
