<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บิลง่าย BillNgai · ระบบออกเอกสาร</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ============================================================
     DESIGN TOKENS — Apple HIG restyle 2026-10-09
     review/2026-10-09/design/HIG-RESTYLE-PLAN.md · BRAND.md records the owner decision.
     Semantic colours follow the OS appearance; the printed .paper keeps its own light palette.
     mobile/scripts/prepare-web.cjs reads --bg and --accent from this block as literal hex.
     ============================================================ */
  :root{
    color-scheme:light dark;
    --bg:#F5F3EF;
    --surface:#FFFFFF;
    --surface-2:#F2F2F7;
    --surface-3:#E5E5EA;
    --fill:rgba(120,120,128,.20);
    --fill-2:rgba(120,120,128,.16);
    --fill-3:rgba(120,120,128,.12);
    --fill-4:rgba(120,120,128,.08);
    --border:rgba(60,60,67,.29);
    --border-soft:rgba(60,60,67,.12);
    --text:#1D1D1F;
    --text-dim:#515154;
    --text-faint:#6E6E73;
    --placeholder:rgba(60,60,67,.30);
    --accent:#FF6B00;
    --accent-fill:var(--accent);
    --on-accent:#231307;
    --accent-ink:#A84400;
    --accent-dim:var(--accent-ink);
    --accent-deep:var(--accent-ink);
    --accent-strong:color-mix(in srgb,var(--accent) 80%,var(--on-accent));
    --accent-bright:color-mix(in srgb,var(--accent) 80%,var(--surface));
    --accent-tint:color-mix(in srgb,var(--accent) 12%,var(--surface));
    --accent-tint-bd:color-mix(in srgb,var(--accent) 28%,var(--border));
    --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent);
    --accent-soft-2:color-mix(in srgb,var(--accent) 5%,transparent);
    --accent-sel:color-mix(in srgb,var(--accent) 24%,transparent);
    --accent-glow:color-mix(in srgb,var(--accent) 30%,transparent);
    --sys-green:#34C759; --sys-red:#FF3B30; --sys-yellow:#FFCC00; --sys-blue:#007AFF; --sys-grey:#8E8E93;
    --green:#197044; --green-bg:#E6F4EC;
    --blue:#315C80; --blue-bg:#EAF2FA; --blue-bd:#C8DCEE;
    --grey:#66717D; --grey-bg:#ECF0F2;
    --on-danger:#FFFFFF; --red:#AD302C; --red-bg:#FCEDEC; --red-bd:#EBC6C4;
    --amber:#7E570E; --amber-bg:#FFF4D8; --amber-bd:#E7D5A6;
    --scrim:rgba(0,0,0,.32);
    --radius-control:999px; --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-pill:999px;
    --shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);
    --shadow-pop:0 6px 24px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06);
    --shadow-sm:none;
    --ring:0 0 0 3px var(--accent-glow);
    --font:"LINE Seed Sans TH",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --font-display:var(--font); --spring:ease-out;
    /* macOS text styles (points). mobile.css swaps in the iOS scale. */
    --fs-large-title:26px; --fs-title1:22px; --fs-title2:17px; --fs-title3:15px;
    --fs-headline:13px; --fs-body:13px; --fs-callout:12px; --fs-subhead:12px; --fs-caption:11px;
    --control-h:32px; --control-h-sm:26px; --control-pad:14px;
    --sidebar-w:220px; --toolbar-h:52px; --titlebar-inset:0px;
    --lh:1.45;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1C1C1E;
      --surface:#2C2C2E;
      --surface-2:#3A3A3C;
      --surface-3:#48484A;
      --fill:rgba(120,120,128,.36);
      --fill-2:rgba(120,120,128,.32);
      --fill-3:rgba(120,120,128,.24);
      --fill-4:rgba(120,120,128,.18);
      --border:rgba(84,84,88,.65);
      --border-soft:rgba(84,84,88,.35);
      --text:#F5F5F7;
      --text-dim:#B9B9BE;
      --text-faint:#98989D;
      --placeholder:rgba(235,235,245,.30);
      --accent:#FF7D26;
      --accent-ink:#FFA366;
      --sys-green:#30D158; --sys-red:#FF453A; --sys-yellow:#FFD60A; --sys-blue:#0A84FF; --sys-grey:#8E8E93;
      --green:#5FD18A; --green-bg:rgba(48,209,88,.16);
      --blue:#7FB6F0; --blue-bg:rgba(10,132,255,.16); --blue-bd:rgba(10,132,255,.35);
      --grey:#AEAEB2; --grey-bg:rgba(142,142,147,.18);
      --red:#FF6B61; --red-bg:rgba(255,69,58,.16); --red-bd:rgba(255,69,58,.35);
      --amber:#FFD15C; --amber-bg:rgba(255,214,10,.14); --amber-bd:rgba(255,214,10,.32);
      --scrim:rgba(0,0,0,.55);
      --shadow:0 16px 48px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.08);
      --shadow-pop:0 8px 28px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.08);
    }
  }
  /* macOS Electron window: title bar is hidden (traffic lights inset), sidebar is a vibrancy region. */
  html.mac-window{--titlebar-inset:52px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    font-size:var(--fs-body);
    line-height:var(--lh);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  html.mac-window,html.mac-window body{background:transparent}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:var(--fs-body)}
  ::placeholder{color:var(--placeholder)}
  a{color:var(--accent-ink);text-decoration:none}
  .ic{display:inline-block;vertical-align:-.18em;flex:0 0 auto}
  .empty .big .ic,.nav .ico .ic{vertical-align:middle}
  ::selection{background:var(--accent-sel)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--fill);border:3px solid transparent;background-clip:padding-box;border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);background-clip:padding-box}
  :focus-visible{outline:none;box-shadow:var(--ring)}
  button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--ring)}
  input[type="checkbox"],input[type="radio"]{accent-color:var(--accent);width:14px;height:14px;margin:0 2px 0 0;vertical-align:-2px;cursor:pointer}
  input[type="checkbox"]:focus-visible,input[type="radio"]:focus-visible{outline:none;box-shadow:var(--ring);border-radius:4px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

  /* ---- rubber stamp: the "got paid" moment ---- */
  .stamp-fx{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .stamp-fx .st{
    font-weight:700;font-size:58px;letter-spacing:3px;line-height:1;
    color:#b23a2c;border:6px double #b23a2c;border-radius:16px;padding:16px 42px 18px;
    background:rgba(252,251,247,.86);
    box-shadow:0 24px 60px -18px rgba(178,58,44,.45);
    animation:stampIn .4s ease-out both,stampOut .35s ease-in 1s forwards;
  }
  .stamp-fx .st small{display:block;font-size:14px;font-weight:700;letter-spacing:1.5px;margin-top:6px;text-align:center;opacity:.85}
  @keyframes stampIn{
    0%{opacity:0;transform:rotate(-26deg) scale(1.6)}
    100%{opacity:1;transform:rotate(-12deg) scale(1)}
  }
  @keyframes stampOut{to{opacity:0;transform:rotate(-12deg) scale(1.03) translateY(-10px)}}
  /* persistent on-screen mark on paid invoices (kept off the printed page) */
  .reissue-reference,.settled-reference{border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;font-size:var(--fs-callout)}
  .paper{position:relative}
  .paper .paid-stamp{
    position:absolute;top:46px;right:200px;transform:rotate(-12deg);pointer-events:none;
    font-weight:800;font-size:22px;letter-spacing:2px;color:rgba(178,58,44,.72);
    border:3px double rgba(178,58,44,.72);border-radius:10px;padding:6px 16px;
  }
  /* overdue: a steady red dot, no looping animation (HIG: no looping motion) */
  .pillar.owed.pulse .label::before{background:var(--sys-red)}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  /* ============================================================
     LAYOUT — sidebar (navigation layer) + main (content layer)
     ============================================================ */
  .app{display:flex;min-height:100vh;position:relative;z-index:1}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    background:var(--surface-2);
    border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    padding-top:var(--titlebar-inset);
    -webkit-app-region:drag;
  }
  html.mac-window .sidebar{background:transparent;border-right-color:rgba(0,0,0,.08)}
  @media (prefers-color-scheme:dark){html.mac-window .sidebar{border-right-color:rgba(255,255,255,.08)}}
  .sidebar button,.sidebar a,.sidebar input,.sidebar kbd{-webkit-app-region:no-drag}
  .brand{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
  .brand .mark{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .brand .mark img{width:100%;height:100%;object-fit:contain;display:block}
  .brand h1{font-size:var(--fs-headline);font-weight:700;line-height:1.2}
  .brand .sub{font-size:var(--fs-caption);color:var(--text-faint);margin-top:1px}
  .nav{padding:8px 12px;flex:1}
  .nav button{
    display:flex;align-items:center;gap:10px;width:100%;min-height:32px;
    padding:6px 10px;border-radius:var(--radius-sm);position:relative;
    color:var(--text);font-size:var(--fs-body);font-weight:500;
    margin-bottom:2px;text-align:left;transition:background .16s ease,color .16s ease;
  }
  .nav button:hover{background:var(--fill-4)}
  .nav button:active{background:var(--fill-3)}
  .nav button.active{background:var(--accent);color:var(--on-accent);font-weight:600}
  .nav button.active::before{display:none}
  .nav button .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);transition:color .16s ease}
  .nav button.active .ico{color:inherit}
  .nav .badge{margin-left:auto;font-size:var(--fs-caption);background:var(--fill-2);color:var(--text-dim);
    border-radius:var(--radius-pill);padding:1px 7px;font-weight:600;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .nav button.active .badge{background:rgba(255,255,255,.55);color:var(--on-accent)}
  .cmdk-hint{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);margin:4px 12px 8px;padding:0 10px;min-height:28px;
    border:1px solid var(--border-soft);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-faint);font-size:var(--fs-body);text-align:left}
  .cmdk-hint .ico{color:var(--text-faint);display:inline-flex}
  .cmdk-hint:hover{border-color:var(--border);color:var(--text-dim)}
  .cmdk-hint kbd{margin-left:auto;font-size:var(--fs-caption);font-family:inherit;color:var(--text-faint)}
  .file-status{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-soft);font-size:var(--fs-caption);color:var(--text-faint);display:flex;align-items:center;gap:8px;min-width:0}
  .file-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sys-grey);flex:0 0 auto}
  .file-status.connected .dot{background:var(--sys-green)}
  .file-status.unsaved .dot{background:var(--sys-yellow)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .topbar{
    display:flex;align-items:center;gap:12px;padding:0 24px;min-height:var(--toolbar-h);
    padding-top:var(--titlebar-inset);
    position:sticky;top:0;z-index:20;flex-wrap:wrap;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid transparent;transition:border-color .16s ease;
    -webkit-app-region:drag;
  }
  html.mac-window .topbar{padding-top:0;min-height:var(--titlebar-inset)}
  .topbar.scrolled{border-bottom-color:var(--border-soft)}
  .topbar button,.topbar a,.topbar input,.topbar select,.topbar details{-webkit-app-region:no-drag}
  .topbar h2{font-size:var(--fs-title2);font-weight:600;letter-spacing:-.2px;line-height:1.3;min-width:0}
  .topbar .spacer{flex:1}
  .topbar #breadcrumb{flex:0 0 100%;font-size:var(--fs-callout);color:var(--text-faint);margin:4px 0 -6px}
  .topbar #breadcrumb:empty{display:none}
  .content{padding:16px 24px 48px;max-width:1180px;width:100%}

  /* ============================================================
     BUTTONS — capsule push buttons; one prominent action per view
     ============================================================ */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:var(--control-h);padding:0 var(--control-pad);border-radius:var(--radius-control);
    font-size:var(--fs-body);font-weight:600;line-height:1.2;white-space:nowrap;
    background:var(--fill-2);color:var(--text);border:1px solid transparent;
    transition:background .12s ease,color .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .btn:hover{background:var(--fill)}
  .btn:active{background:var(--fill);filter:brightness(.92)}
  .btn-primary{background:var(--accent-fill);color:var(--on-accent)}
  .btn-primary:hover{background:color-mix(in srgb,var(--accent-fill),#000 8%)}
  .btn-primary:active{background:color-mix(in srgb,var(--accent-fill),#000 16%);filter:none}
  .btn-danger-solid{background:var(--sys-red);color:var(--on-danger)}
  .btn-danger-solid:hover{background:color-mix(in srgb,var(--sys-red),#000 10%)}
  .btn-ghost{background:transparent;color:var(--accent-ink)}
  .btn-ghost:hover{background:var(--fill-4);color:var(--accent-ink)}
  .btn-danger{color:var(--red);background:var(--fill-3)}
  .btn-danger:hover{background:var(--red-bg)}
  .btn-sm{min-height:var(--control-h-sm);padding:0 11px;font-size:var(--fs-callout)}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  #topActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  #topActions>.btn-primary{position:static;box-shadow:none}
  .x{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--fill-3);color:var(--text-dim);transition:background .12s}
  .x:hover{background:var(--fill);color:var(--text)}
  .x .ic{width:14px;height:14px}

  /* ============================================================
     SEGMENTED CONTROLS, CHIPS, BADGES
     ============================================================ */
  .tabs{display:inline-flex;gap:2px;margin-bottom:16px;padding:2px;border-radius:var(--radius-control);background:var(--fill-3);flex-wrap:wrap;max-width:100%}
  .tabs button{min-height:28px;padding:0 14px;font-size:var(--fs-body);font-weight:500;color:var(--text-dim);
    border:none;border-radius:var(--radius-control);transition:background .12s ease,color .12s ease,box-shadow .12s ease}
  .tabs button:hover{color:var(--text)}
  .tabs button.active{color:var(--text);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
  @media (prefers-color-scheme:dark){.tabs button.active{background:var(--surface-3);box-shadow:0 1px 3px rgba(0,0,0,.4)}}
  .pill-select,.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
  .pill-select button,.filter-chips button{flex:0 0 auto;white-space:nowrap;min-height:28px;padding:0 12px;border-radius:var(--radius-control);font-size:var(--fs-body);font-weight:500;
    background:var(--fill-3);border:1px solid transparent;color:var(--text);transition:background .12s ease,color .12s ease}
  .pill-select button:hover,.filter-chips button:hover{background:var(--fill-2)}
  .pill-select button.on,.filter-chips button.on{background:var(--accent-fill);color:var(--on-accent);font-weight:600}
  .chip{display:inline-block;font-size:var(--fs-caption);font-weight:600;padding:2px 9px;border-radius:var(--radius-pill);
    background:var(--fill-3);color:var(--text-dim);margin-top:8px;margin-right:4px}

  .badge-status{display:inline-flex;align-items:center;gap:6px;min-height:22px;box-sizing:border-box;
    max-width:100%;white-space:nowrap;word-break:keep-all;font-size:var(--fs-caption);font-weight:600;line-height:1;
    padding:3px 9px;border-radius:var(--radius-pill);background:var(--fill-3);color:var(--text-dim);vertical-align:middle}
  .badge-status .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .s-draft{color:var(--text-dim)}.s-draft .d{background:var(--sys-grey)}
  .s-sent{background:var(--blue-bg);color:var(--blue)}.s-sent .d{background:var(--sys-blue)}
  .s-paid,.s-accepted,.s-issued{background:var(--green-bg);color:var(--green)}.s-paid .d,.s-accepted .d,.s-issued .d{background:var(--sys-green)}
  .s-overdue,.s-declined{background:var(--red-bg);color:var(--red)}.s-overdue .d,.s-declined .d{background:var(--sys-red)}

  /* ============================================================
     CARDS / DASHBOARD — grouped containers, 12px, hairline in light
     ============================================================ */
  .pillars{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px;margin-bottom:24px}
  .pillar,.card-block,.chart-card,.client-card,.filing-card,.report-cards .rc,.mini-stat,.fx-chip,.brand-snapshot,.filing-guide,.filing-note,.ladder,.split-progress,.empty,.doc-actions{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  @media (prefers-color-scheme:dark){
    .pillar,.card-block,.chart-card,.client-card,.filing-card,.report-cards .rc,.mini-stat,.fx-chip,.brand-snapshot,.filing-guide,.filing-note,.ladder,.split-progress,.empty,.doc-actions{border-color:transparent}
  }
  .pillar{padding:20px;position:relative;overflow:hidden;container-type:inline-size;animation:fadeUp .2s ease-out both}
  .pillar .label{font-size:var(--fs-callout);color:var(--text-dim);font-weight:600;display:flex;align-items:center;gap:7px}
  .pillar .val{font-size:clamp(28px,12cqi,44px);white-space:nowrap;font-weight:700;margin-top:12px;letter-spacing:-.4px;line-height:1.15;font-variant-numeric:tabular-nums}
  .pillar .sub{font-size:var(--fs-callout);color:var(--text-faint);margin-top:8px;line-height:1.5}
  .pillar .accent-bar{display:none}
  .pillar .label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sys-grey);display:inline-block;flex:0 0 auto}
  .pillar.received .label::before{background:var(--sys-green)}
  .pillar.received{background:var(--accent);border-color:var(--accent);--text:var(--on-accent);--text-dim:var(--on-accent);--text-faint:var(--on-accent);--accent-ink:var(--on-accent)}
  .pillar.received .label,.pillar.received .val,.pillar.received .sub{color:var(--on-accent)}
  .pillar.received .label::before{background:var(--on-accent);opacity:.7}
  .pillar.wht .val{color:var(--text)}
  .pillar .val-tag{margin-top:8px}

  .section-title{font-size:var(--fs-title3);font-weight:600;color:var(--text);margin:28px 0 12px}
  .brand-snapshot{
    display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:center;
    padding:20px 24px;margin-bottom:16px;overflow:hidden;position:relative;animation:fadeUp .2s ease-out both;
  }
  .brand-snapshot::before{display:none}
  .brand-snapshot .kicker{font-size:var(--fs-caption);font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent-ink);margin-bottom:6px}
  .brand-snapshot h3{font-size:var(--fs-title1);font-weight:700;line-height:1.2;margin-bottom:6px}
  .brand-snapshot p{font-size:var(--fs-body);color:var(--text-dim);max-width:520px}
  .brand-snapshot .brand-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .brand-snapshot .brand-art{min-height:170px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:var(--radius-sm);overflow:hidden}
  .brand-snapshot .brand-art .fintech-art{width:240px;height:160px;max-width:100%;object-fit:cover}
  @media(max-width:860px){
    .brand-snapshot{grid-template-columns:1fr;padding:20px}
    .brand-snapshot .brand-art{min-height:160px}
  }
  .mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
  .mini-stat{padding:16px 18px}
  .mini-stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .mini-stat .l{font-size:var(--fs-callout);color:var(--text-faint);margin-top:3px}
  .fx-row{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
  .fx-chip{display:flex;align-items:center;gap:16px;padding:10px 16px;font-size:var(--fs-body);font-variant-numeric:tabular-nums}
  .fx-chip .fx-cur{font-weight:700;color:var(--accent-ink);font-size:var(--fs-body);letter-spacing:.2px}
  .fx-chip .fx-pair .fx-l{color:var(--text-faint);font-size:var(--fs-callout);margin-right:5px}
  /* report / tax summary */
  .report-head{margin-bottom:16px}
  .year-pick{display:flex;align-items:center;gap:10px;font-size:var(--fs-body);font-weight:600;color:var(--text-dim);flex-wrap:wrap}
  .year-pick select{font-size:var(--fs-body);font-weight:600;min-height:var(--control-h);padding:0 28px 0 12px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238E8E93' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center}
  .report-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .report-cards .rc{padding:20px}
  .report-cards .rc.accent{background:var(--accent-tint);border-color:var(--accent-tint-bd)}
  .report-cards .rc.net{background:var(--accent);border-color:var(--accent);--text:var(--on-accent);--text-dim:var(--on-accent);--text-faint:var(--on-accent);--accent-ink:var(--on-accent)}
  .report-cards .rc.net .rl,.report-cards .rc.net .rs,.report-cards .rc.net .rv{color:var(--on-accent)}
  .report-cards .rl{font-size:var(--fs-callout);color:var(--text-faint)}
  .report-cards .rv{font-size:clamp(24px,3vw,32px);font-weight:700;font-variant-numeric:tabular-nums;margin:5px 0 3px;line-height:1.25;overflow-wrap:anywhere}
  .report-cards .rs{font-size:var(--fs-callout);color:var(--text-faint);line-height:1.4}
  .chart-card{padding:24px}
  .chart-card .ch-title{font-size:var(--fs-callout);font-weight:600;color:var(--text-dim);margin-bottom:16px}
  .report-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
  .filing-guide{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:center;padding:20px 24px;margin-bottom:16px}
  .filing-guide .kicker{font-size:var(--fs-caption);font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent-ink);margin-bottom:6px}
  .filing-guide h3{font-size:var(--fs-title1);line-height:1.2;margin-bottom:6px}
  .filing-guide p{font-size:var(--fs-body);color:var(--text-dim);max-width:620px}
  .filing-guide .guide-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .filing-guide .guide-art{height:145px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:#fff}
  .filing-guide .guide-art img{max-width:175px;max-height:126px;object-fit:contain}
  .filing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
  .filing-card{padding:20px}
  .filing-card .filing-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
  .filing-card h3{font-size:var(--fs-title3);font-weight:600;line-height:1.35}
  .filing-card .period{font-size:var(--fs-callout);color:var(--text-faint);margin-top:3px}
  .filing-card .due{font-size:var(--fs-callout);font-weight:600;text-align:right;white-space:nowrap;color:var(--text-dim)}
  .filing-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .filing-summary .cell{border-radius:var(--radius-sm);padding:10px;background:var(--surface-2)}
  .filing-summary .label{font-size:var(--fs-callout);color:var(--text-faint);margin-bottom:4px}
  .filing-summary .value{font-size:var(--fs-title3);font-weight:700;font-variant-numeric:tabular-nums}
  .filing-detail{margin-top:10px}
  .filing-detail table{border:none;border-radius:0;box-shadow:none;background:transparent}
  .filing-detail tbody td{padding:8px 4px}
  .filing-detail .line{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:var(--fs-callout)}
  .filing-detail .line:last-child{border-bottom:none}
  .filing-detail .line>span{color:var(--text-dim);flex-shrink:0}
  .filing-detail .line>b{text-align:right;overflow-wrap:anywhere}
  .filing-note{padding:16px 18px;margin-top:16px;color:var(--text-dim);font-size:var(--fs-callout);line-height:1.7}
  .filing-note b{color:var(--text)}
  .rmonths{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:8px}
  .rmonth{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .rbar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}
  .rbar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:.2s}
  .rm-l{font-size:var(--fs-caption);color:var(--text-faint)}
  .rclient{width:100%;border-collapse:collapse;box-shadow:none;background:transparent;border:none}
  .rclient td{padding:8px 4px;border-bottom:1px solid var(--border-soft);font-size:var(--fs-callout)}
  .rclient td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  @media(max-width:760px){
    .report-cards{grid-template-columns:1fr 1fr}
    .report-grid,.filing-grid,.filing-guide{grid-template-columns:1fr}
    .filing-summary{grid-template-columns:1fr}
  }

  /* ============================================================
     TABLE / LIST — grouped inset lists
     ============================================================ */
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;max-width:340px;position:relative}
  .search input{width:100%;min-height:var(--control-h);background:var(--fill-3);border:1px solid transparent;
    border-radius:var(--radius-control);padding:0 13px 0 32px;color:var(--text);transition:background .12s,box-shadow .12s}
  .search input:focus{outline:none;background:var(--surface);box-shadow:var(--ring)}
  .search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);display:inline-flex}

  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius);overflow:hidden}
  @media (prefers-color-scheme:dark){table{border-color:transparent}}
  thead th{text-align:left;font-size:var(--fs-caption);text-transform:none;
    color:var(--text-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border-soft);background:var(--surface)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border-soft);font-size:var(--fs-body)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--fill-4)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  .doc-no{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
  .muted{color:var(--text-faint)}
  .table-scroll{overflow-x:auto;border-radius:var(--radius)}
  td.nowrap,td.muted{white-space:nowrap}
  td.cell-client{min-width:170px}
  tbody tr[tabindex]:focus-visible,.client-card:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}

  .empty{text-align:center;padding:56px 20px;color:var(--text-faint)}
  .empty .big{font-size:38px;margin-bottom:12px;opacity:.5}
  .empty.brand-empty{padding:40px 22px}
  .empty.brand-empty .brand-empty-art{min-height:138px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
  .empty.brand-empty .brand-empty-art img{max-height:136px;max-width:260px;object-fit:contain;display:block;border-radius:var(--radius-sm)}
  .empty.brand-empty .brand-empty-title{color:var(--text);font-weight:600;font-size:var(--fs-title3)}
  .empty.brand-empty .brand-empty-sub{font-size:var(--fs-callout);margin-top:4px;color:var(--text-faint)}

  /* Local decorative renders: finite entrance, then optional pointer feedback. */
  .empty.brand-empty .brand-empty-art img.fintech-art,.fintech-art{
    width:216px;height:136px;max-width:100%;object-fit:cover;object-position:center 55%;
    display:block;flex-shrink:0;
    animation:fintechArtIn 240ms ease-out;
    transition:transform 200ms ease-out;
  }
  .empty.brand-empty .brand-empty-art img.fintech-art-portrait{height:160px;max-height:none}
  .setup-art{display:flex;align-items:center;justify-content:center;height:136px;margin-bottom:16px;overflow:hidden}
  @keyframes fintechArtIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(hover:hover) and (pointer:fine){
    .brand-empty-art:hover .fintech-art,.setup-art:hover .fintech-art,.brand-art:hover .fintech-art{transform:translateY(-4px) rotate(-2deg)}
  }
  /* The PNG renders carry a white plate that glows in Dark Mode (HIG dark-mode: modify the asset or use separate
     light/dark assets). Until they are re-exported with transparency, Dark Mode shows the text without the art. */
  @media(prefers-color-scheme:dark){.setup-art,.brand-empty-art,.brand-snapshot .brand-art,.filing-guide .guide-art{display:none}}
  @media(prefers-reduced-motion:reduce){
    .fintech-art,.empty.brand-empty .brand-empty-art img.fintech-art,
    .brand-empty-art:hover .fintech-art,.setup-art:hover .fintech-art{
      animation:none!important;transition:none!important;transform:none!important;
    }
  }

  /* client cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .client-card{padding:18px 20px;cursor:pointer;transition:background .12s ease;animation:fadeUp .2s ease-out both}
  .client-card:hover{background:var(--surface-2)}
  @media (prefers-color-scheme:dark){.client-card:hover{background:var(--surface-3)}}
  .client-card h3{font-size:var(--fs-title3);font-weight:600}
  .client-card .meta{font-size:var(--fs-callout);color:var(--text-faint);margin-top:6px;line-height:1.7}
  .client-card .tax{font-variant-numeric:tabular-nums}

  /* Documents list: inset grouped rows */
  .doc-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .document-card{min-width:0;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);overflow:hidden}
  @media (prefers-color-scheme:dark){.document-card{border-color:transparent}}
  .document-card:hover{background:var(--surface-2)}
  @media (prefers-color-scheme:dark){.document-card:hover{background:var(--surface-3)}}
  .document-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);align-items:start;gap:20px;width:100%;padding:20px;text-align:left}
  .document-main:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:var(--radius)}
  .document-info{display:flex;flex-direction:column;min-width:0;gap:6px}
  .document-heading{display:flex;flex-wrap:wrap;gap:8px;font-size:var(--fs-callout);color:var(--text-faint)}
  .document-heading b{font-size:var(--fs-body);color:var(--text);font-variant-numeric:tabular-nums}
  .document-client{font-size:var(--fs-title3);font-weight:600;line-height:1.4}
  .document-meta{font-size:var(--fs-callout);color:var(--text-faint);line-height:1.5}
  .document-info span,.document-heading b{overflow-wrap:anywhere}
  .document-amount{display:flex;flex-direction:column;gap:6px;text-align:right;max-width:200px;font-size:var(--fs-callout);color:var(--text-faint);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .document-amount strong{color:var(--text);font-size:22px;line-height:1.2;font-weight:700}
  .document-amount small{font-size:var(--fs-callout)}
  .document-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid var(--border-soft);padding:12px 20px;min-height:56px}
  .document-footer .badge-status{white-space:normal;overflow-wrap:anywhere}
  .doc-list-compact{grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);overflow:hidden}
  @media (prefers-color-scheme:dark){.doc-list-compact{border-color:transparent}}
  .doc-list-compact .document-card{display:grid;grid-template-columns:minmax(0,1fr) 176px;border:0;border-bottom:1px solid var(--border-soft);border-radius:0;background:transparent}
  .doc-list-compact .document-card:last-child{border-bottom:0}
  .doc-list-compact .document-card:hover{background:var(--fill-4)}
  .doc-list-compact .document-main{grid-template-columns:minmax(0,1fr) 120px minmax(136px,160px);align-items:center;gap:16px;padding:12px 16px;min-height:56px}
  .doc-list-compact .document-info{gap:0}
  .doc-list-compact .document-date{display:flex;flex-direction:column;gap:0;font-size:var(--fs-callout);color:var(--text-faint);font-variant-numeric:tabular-nums}
  .doc-list-compact .document-amount{gap:0;max-width:none}
  .doc-list-compact .document-amount strong{font-size:var(--fs-title3);line-height:1.5}
  .doc-list-compact .document-footer{border:0;padding:12px 16px;gap:8px;flex-direction:column;justify-content:center;align-items:flex-start;min-width:0}

  /* ============================================================
     MODAL — sheets; CONFIRM — alert
     ============================================================ */
  .overlay{position:fixed;inset:0;background:var(--scrim);
    z-index:100;display:none;align-items:flex-start;justify-content:center;padding:32px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:var(--radius-lg);
    width:100%;max-width:840px;box-shadow:var(--shadow);margin:auto;animation:modalIn .2s ease-out}
  .modal-head{display:flex;align-items:center;gap:12px;padding:20px 24px 0}
  .modal-head h3{font-size:var(--fs-title2);font-weight:600}
  .modal-head .spacer{flex:1}
  .modal-body{padding:20px 24px 24px}
  .modal-foot{display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--border-soft);justify-content:flex-end;flex-wrap:wrap;
    background:var(--surface);border-radius:0 0 var(--radius-lg) var(--radius-lg);position:sticky;bottom:0;z-index:2}

  /* forms */
  .field{margin-bottom:16px;min-width:0}
  .field label{display:block;font-size:var(--fs-subhead);font-weight:600;color:var(--text-dim);margin-bottom:6px}
  .field input:not([type="checkbox"]):not([type="radio"]),.field select,.field textarea{
    width:100%;min-height:var(--control-h);background:var(--surface-2);border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);padding:6px 12px;color:var(--text);transition:border-color .12s,box-shadow .12s,background .12s}
  .field select{appearance:none;padding-right:28px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238E8E93' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:var(--ring)}
  .field textarea{resize:vertical;min-height:88px;line-height:var(--lh)}
  .field .hint{font-size:var(--fs-callout);color:var(--text-faint);margin-top:5px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  /* inline attestation rows (checkbox + label) */
  p>label:has(>input[type="checkbox"]),.legacy-choice{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-body);line-height:var(--lh);cursor:pointer}
  p>label:has(>input[type="checkbox"])>input,.legacy-choice>input{margin-top:3px}

  /* line items editor */
  .items-table{width:100%;border-collapse:collapse;margin-bottom:10px;background:transparent;border:none;box-shadow:none;border-radius:0}
  .items-table th{font-size:var(--fs-caption);color:var(--text-faint);text-align:left;padding:6px 8px;font-weight:600;background:transparent;border:none}
  .items-table td{padding:4px 6px;border:none}
  .items-table input{width:100%;min-height:28px;background:var(--surface-2);border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);padding:4px 10px;color:var(--text);transition:border-color .12s,box-shadow .12s}
  .items-table input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:var(--ring)}
  .items-table .del{color:var(--text-faint);font-size:16px;padding:4px 9px;border-radius:var(--radius-sm);transition:.12s}
  .items-table .del:hover{color:var(--red);background:var(--red-bg)}

  /* tax ladder */
  .ladder{padding:16px 20px;font-variant-numeric:tabular-nums}
  .ladder .row{display:flex;justify-content:space-between;padding:6px 0;font-size:var(--fs-body)}
  .ladder .row .lbl{color:var(--text-dim)}
  .ladder .row.sub{border-top:1px solid var(--border-soft);margin-top:5px;padding-top:10px;font-weight:600}
  .ladder .row.minus .amt{color:var(--red)}
  .ladder .row.net{border-top:1px solid var(--border-soft);margin-top:7px;padding-top:12px;font-size:var(--fs-title2);font-weight:700}
  .ladder .row.net .amt{color:var(--accent-ink)}
  .ladder .row.grand{font-weight:700}

  /* ============================================================
     DOCUMENT PREVIEW (print)
     ============================================================ */
  .doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;padding:12px 16px}
  .doc-trail,.quotation-progress{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 18px;font-size:var(--fs-callout);color:var(--text-faint)}
  .doc-trail .trail-l{display:inline-flex;align-items:center;gap:3px}
  .doc-trail .trail-chip{cursor:pointer;background:var(--fill-3);border-radius:var(--radius-pill);
    padding:3px 10px;color:var(--text-dim);transition:.12s;text-decoration:none}
  .doc-trail .trail-chip:hover{background:var(--fill-2);color:var(--text)}
  .doc-trail .trail-chip b{font-variant-numeric:tabular-nums}
  .doc-trail .trail-sep{width:1px;height:16px;background:var(--border)}
  .split-progress{max-width:820px;margin:0 auto 18px;padding:14px 16px}
  .split-progress .sp-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;font-size:var(--fs-callout)}
  .split-progress .sp-head b{font-size:var(--fs-body)}
  .split-progress .sp-track{height:8px;border-radius:4px;background:var(--fill-3);overflow:hidden;display:flex}
  .split-progress .sp-paid{height:100%;background:var(--accent);transition:.2s}
  .split-progress .sp-billed{height:100%;background:var(--accent);opacity:.32;transition:.2s}
  .split-progress .sp-stats{display:flex;gap:18px;margin-top:9px;font-size:var(--fs-callout);color:var(--text-dim);flex-wrap:wrap}
  .split-progress .sp-stats b{font-variant-numeric:tabular-nums}
  .split-rows{width:100%;border-collapse:collapse;font-size:var(--fs-callout);border:none;background:transparent;border-radius:0}
  .split-rows th{text-align:left;font-weight:600;color:var(--text-dim);padding:4px 6px;font-size:var(--fs-caption);background:transparent;border:none}
  .split-rows td{padding:4px 6px;vertical-align:middle;border:none}
  .split-rows input{width:100%}
  .split-rows .num-col{width:88px}
  .split-rows .amt-col{width:120px}
  .split-rows .date-col{width:140px}
  .split-rows .bal{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent-ink)}
  /* The printed paper keeps its own light palette, geometry and type; unchanged by the app restyle. */
  .paper{color-scheme:light;--accent:var(--document-accent,#ff6b00);--accent-ink:var(--document-accent-ink,#b24b00);
    --text:#2D3436;--text-dim:#645d54;--text-faint:#756c61;--surface:#fff;--surface-2:#faf3ea;--surface-3:#f3e9dc;
    --border:#e8dccb;--border-soft:#f0e6d8;--radius:8px;--radius-sm:6px;--radius-lg:12px;
    --green:#1f7a4d;--green-bg:#e3efe5;--red:#b23a2c;--red-bg:#f6e7e3;--amber:#956414;--amber-bg:#f4ebd6;
    background:#fff;color:#1f1c17;border-radius:var(--radius);padding:52px 54px;
    max-width:820px;margin:0 auto;box-shadow:none;font-size:13px;line-height:1.55;
    border:1px solid var(--border);animation:fadeUp .2s ease-out both}
  .paper .doc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px;
    padding-bottom:22px;border-bottom:2px solid var(--accent)}
  .paper .biz-name{font-family:var(--font-display);font-size:21px;font-weight:700;color:#16140f;letter-spacing:-.2px}
  .paper .biz-meta{font-size:11.5px;color:#5c574d;margin-top:6px;line-height:1.75}
  .paper .doc-title-box{text-align:right}
  .paper .doc-title{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent-ink);letter-spacing:-.2px}
  .paper .doc-title .en{font-family:var(--font-display);font-size:13px;font-weight:500;color:#8a8576;display:block;margin-top:2px;font-style:italic}
  .paper .doc-meta{font-size:12px;color:#4a463d;margin-top:12px;line-height:2}
  .paper .doc-meta b{color:#16140f;font-variant-numeric:tabular-nums}
  .paper .parties{display:flex;gap:26px;margin-bottom:26px}
  .paper .party{flex:1;background:#fff;border:1px solid #ece8dd;border-radius:var(--radius);padding:15px 17px}
  .paper .party .h{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#8a8576;font-weight:700;margin-bottom:7px}
  .paper .party .nm{font-weight:700;font-size:14.5px;color:#16140f}
  .paper .party .dt{font-size:11.5px;color:#5c574d;margin-top:5px;line-height:1.75}
  .paper table.lines{width:100%;border-collapse:collapse;margin-bottom:20px;background:transparent;border:none;box-shadow:none;border-radius:0}
  .paper table.lines th{background:var(--accent);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    padding:11px 13px;text-align:left;font-weight:600}
  .paper table.lines th.r,.paper table.lines td.r{text-align:right}
  .paper table.lines td{padding:11px 13px;border-bottom:1px solid #efece4;font-size:12.5px;vertical-align:top;font-variant-numeric:tabular-nums}
  .paper table.lines th:first-child{border-radius:7px 0 0 0}
  .paper table.lines th:last-child{border-radius:0 7px 0 0}
  .paper .totals{display:flex;justify-content:flex-end;margin-bottom:24px}
  .paper .totals .box{width:320px;font-variant-numeric:tabular-nums}
  .paper .totals .tr{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px}
  .paper .totals .tr .l{color:#5c574d}
  .paper .totals .tr.grand{border-top:1px solid #ded7c9;margin-top:6px;padding-top:10px;font-weight:700;font-size:15px;color:#16140f}
  .paper .totals .tr.wht .v{color:#b23a2c}
  .paper .totals .tr.net{background:var(--accent-tint);border:1px solid var(--accent-tint-bd);border-radius:8px;padding:11px 13px;margin-top:8px;font-weight:700;font-size:15px}
  .paper .totals .tr.net .l{color:var(--accent-ink)}
  .paper .totals .tr.net .v{color:var(--accent-ink);font-family:var(--font-display)}
  .paper .totals .baht-words{text-align:right;font-size:11px;color:#5c574d;padding:2px 0 5px}
  .paper .footer-grid{display:flex;gap:30px;margin-top:26px;padding-top:22px;border-top:1px solid #efece4}
  .paper .footer-grid .col{flex:1}
  .paper .footer-grid .h{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#8a8576;font-weight:700;margin-bottom:7px}
  .paper .footer-grid .bank{font-size:12px;color:#3a362d;line-height:1.85}
  .paper .sign{margin-top:42px;display:flex;justify-content:flex-end;gap:50px;text-align:center}
  .paper .sign .sign-col{display:flex;flex-direction:column;align-items:center}
  .paper .sign .ink{position:relative;height:54px;width:185px;display:flex;align-items:flex-end;justify-content:center}
  .paper .sign .ink .sig{max-height:50px;max-width:160px;position:relative;z-index:2}
  .paper .sign .ink .stamp{max-height:78px;max-width:110px;position:absolute;left:50%;top:-14px;transform:translateX(-50%) rotate(-8deg);opacity:.82;z-index:1}
  .paper .sign .line{border-top:1px solid #b8b2a3;width:185px;padding-top:8px;font-size:11px;color:#6b6557}
  .paper .pay-qr{display:flex;align-items:center;gap:12px}
  .paper .pay-qr .qr-img{width:118px;height:118px;flex:0 0 auto;border:1px solid #ece8dd;border-radius:8px;padding:5px;background:#fff;box-sizing:content-box}
  .paper .pay-qr .qr-img svg{display:block;width:100%;height:100%}
  .paper .pay-qr .qr-cap{font-size:11.5px;color:#3a362d;line-height:1.7}
  .paper .pay-qr .qr-cap b{color:var(--accent-ink);font-size:13px}
  .paper .note-box{font-size:11.5px;color:#7a5a1a;background:#faf4e3;border:1px solid #ecdcb4;border-radius:8px;padding:11px 14px;margin-top:16px}
  .paper .tax-stamp{display:inline-block;border:2px solid var(--accent-ink);color:var(--accent-ink);font-weight:700;font-size:11px;
    padding:4px 11px;border-radius:6px;letter-spacing:.5px;margin-top:7px}
  .paper .logo-img{max-height:56px;max-width:185px;margin-bottom:12px;display:block}

  /* settings */
  .settings-grid{max-width:720px}
  /* switch (macOS 26: 26×15 regular in rows; mobile.css scales it to 51×31) */
  .toggle,.field label.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:0;font-weight:500;color:var(--text);font-size:var(--fs-body)}
  .toggle{position:relative}
  .toggle input{position:absolute;opacity:0;width:1px;height:1px;margin:0}   /* hidden visually, still keyboard/screen-reader operable */
  .toggle input:focus-visible+.track{box-shadow:var(--ring)}
  .toggle .track{display:inline-block;box-sizing:border-box;width:var(--switch-w,30px);height:var(--switch-h,18px);background:var(--fill);
    border-radius:var(--radius-pill);position:relative;transition:background .2s ease-out;flex:0 0 auto}
  .toggle .track::after{content:"";position:absolute;left:2px;top:2px;width:calc(var(--switch-h,18px) - 4px);height:calc(var(--switch-h,18px) - 4px);
    border-radius:50%;background:#fff;transition:transform .2s ease-out;box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06)}
  .toggle input:checked+.track{background:var(--accent)}
  .toggle input:checked+.track::after{transform:translateX(calc(var(--switch-w,30px) - var(--switch-h,18px)))}
  .card-block{padding:20px 24px;margin-bottom:16px;animation:fadeUp .2s ease-out both}
  .card-block h4{font-size:var(--fs-title3);font-weight:600;margin-bottom:4px}
  .card-block .desc{font-size:var(--fs-callout);color:var(--text-faint);margin-bottom:16px;line-height:1.6}
  .card-block>summary{font-weight:600;cursor:pointer}
  .asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .asset{display:flex;flex-direction:column;gap:8px}
  .asset-prev{height:74px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    border-radius:var(--radius-sm);padding:6px}
  .asset-prev img{max-height:62px;max-width:100%;object-fit:contain}
  .asset-prev .muted{font-size:var(--fs-callout)}
  .asset-btns{display:flex;gap:6px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);max-width:calc(100vw - 32px);
    background:var(--text);color:var(--bg);border-radius:var(--radius-pill);
    padding:10px 18px;font-size:var(--fs-body);font-weight:600;box-shadow:var(--shadow-pop);opacity:0;transition:.2s ease-out;z-index:200;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red-bg);color:var(--red);pointer-events:auto;cursor:pointer}
  .toast.has-action{pointer-events:auto}

  /* Finite, local task feedback; never animates amounts or blocks a control. */
  .toast.outcome{display:flex;align-items:center;gap:14px;border-radius:var(--radius-lg)}
  .outcome-art{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 40px;width:40px;height:40px;order:-1;color:var(--accent)}
  .outcome-base{display:inline-flex;animation:outcomeSettle .2s ease-out both}
  .outcome-check{position:absolute;right:-2px;bottom:-2px;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:var(--radius-pill);background:var(--accent);color:var(--on-accent);animation:outcomeCheck .2s ease-out both}
  .outcome-file{position:absolute;top:0;left:6px;background:var(--text);animation:outcomeFile .2s ease-out both}
  .motion-enter,.settings-panel,.wizard-step{animation:panelEnter .2s ease-out both}
  .tax-details[open] > :not(summary){animation:panelEnter .2s ease-out both}
  @keyframes outcomeSettle{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes outcomeCheck{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes outcomeFile{from{opacity:0;transform:translate(-8px,-8px)}to{opacity:1;transform:none}}
  @keyframes panelEnter{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){
    .outcome-base,.outcome-check,.outcome-file,.motion-enter,.settings-panel,.wizard-step,
    .tax-details[open] > :not(summary){animation:none!important;transform:none!important}
    .tax-details summary .ic{transition:none}
    .toast{transition:none}
  }
  .toast-action{margin-left:12px;font-weight:700;text-decoration:underline;color:inherit;font-size:var(--fs-body)}
  .toast.ok{background:var(--text);color:var(--bg)}

  .banner{background:var(--amber-bg);color:var(--amber);padding:12px 16px;
    border-radius:var(--radius);font-size:var(--fs-callout);line-height:1.5;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .banner .banner-text{flex:1}
  .banner.info{background:var(--blue-bg);color:var(--blue)}
  .banner.danger{background:var(--red-bg);color:var(--red)}
  .step-list{margin:0;padding-left:22px;line-height:1.7}

  /* ============================================================
     PRINT
     ============================================================ */
  @media print{
    body.document-output-blocked > *{display:none!important}
    body.document-output-blocked::before{display:block!important;content:attr(data-print-blocked)}
    html,body{background:#fff!important}
    body::before,body::after{display:none!important}
    .sidebar,.topbar,.doc-actions,.overlay,.toast,.banner,.stamp-fx,.paper .paid-stamp{display:none!important}
    /* The document screen prints only its paper: lineage chips, instalment progress and any
       future screen-only card stay on screen. */
    .doc-trail,.quotation-progress,.split-progress{display:none!important}
    #content:has(> .paper) > :not(.paper){display:none!important}
    .main,.content{padding:0;max-width:none;background:#fff}
    .paper{box-shadow:none;border:none;border-radius:0;max-width:none;margin:0;padding:24px 26px;animation:none;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
      zoom:var(--paper-zoom,1)}   /* shrink-to-fit: ตั้งค่าโดย applyPrintZoom() ก่อนพิมพ์/บันทึก PDF */
    /* keep blocks intact across page breaks; never orphan the signature */
    .paper .totals,.paper .footer-grid,.paper .sign,.paper .note-box{break-inside:avoid;page-break-inside:avoid}
    .paper table.lines tr{break-inside:avoid;page-break-inside:avoid}
    .paper .footer-grid{break-after:avoid;page-break-after:avoid}
    .paper .sign{break-before:avoid;page-break-before:avoid}
    /* compress vertical rhythm so the footer + signature stay on the first page */
    .paper .doc-header{margin-bottom:20px;padding-bottom:16px}
    .paper .parties{margin-bottom:18px}
    .paper table.lines{margin-bottom:14px}
    .paper table.lines th{padding:8px 13px}
    .paper table.lines td{padding:8px 13px}
    .paper .totals{margin-bottom:14px}
    .paper .footer-grid{margin-top:16px;padding-top:16px}
    .paper .sign{margin-top:26px}
    @page{size:A4;margin:12mm}
  }
  .tax-details summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-dim);font-weight:600}
  .tax-details summary::-webkit-details-marker{display:none}
  .tax-details summary .ic{transition:transform .2s ease-out}
  .tax-details[open] summary .ic{transform:rotate(90deg)}
  .tax-details summary:hover{color:var(--text)}
  .tax-details[open] summary{margin-bottom:12px}

  /* Command palette (Cmd+K) */
  .cmdk-overlay{position:fixed;inset:0;background:var(--scrim);z-index:2000;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
  .cmdk-overlay.open{display:flex}
  .cmdk{width:560px;max-width:90vw;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
  .cmdk-input-wrap{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-soft)}
  .cmdk-input-wrap input{flex:1;border:none;background:none;font-size:var(--fs-title3);outline:none;color:var(--text)}
  .cmdk-icon{color:var(--text-faint);display:inline-flex}
  .cmdk-input-wrap kbd{font-size:var(--fs-caption);font-family:inherit;background:var(--fill-3);border-radius:4px;padding:2px 6px;color:var(--text-faint)}
  .cmdk-results{max-height:360px;overflow-y:auto;padding:6px}
  .cmdk-item{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:36px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--fs-body)}
  .cmdk-item:hover{background:var(--fill-4)}
  .cmdk-item.active{background:var(--accent);color:var(--on-accent)}
  .cmdk-item.active .cmdk-type,.cmdk-item.active .cmdk-sub,.cmdk-item.active .cmdk-ic{color:inherit}
  .cmdk-item .cmdk-type{font-size:var(--fs-caption);color:var(--text-faint);margin-left:auto;white-space:nowrap}
  .cmdk-item .cmdk-sub{font-size:var(--fs-caption);color:var(--text-dim)}
  .cmdk-item .cmdk-ic{width:20px;display:inline-flex;justify-content:center;color:var(--text-dim)}
  .cmdk-footer{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--border-soft);font-size:var(--fs-caption);color:var(--text-faint)}
  .cmdk-footer kbd{font-size:var(--fs-caption);font-family:inherit;background:var(--fill-3);border-radius:3px;padding:1px 5px}
  .cmdk-empty{padding:24px;text-align:center;color:var(--text-faint);font-size:var(--fs-body)}

  /* Doc detail overflow menu — popover */
  .doc-more summary{padding:6px 12px}
  .doc-more[open] .doc-more-menu{display:block}
  .doc-more-menu{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-pop);min-width:200px;z-index:100;padding:5px}
  .doc-more-menu button{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:5px 10px;border:none;background:none;cursor:pointer;font-size:var(--fs-body);color:var(--text);border-radius:6px;text-align:left}
  .doc-more-menu button:hover{background:var(--accent);color:var(--on-accent)}
  .doc-more-menu button svg{width:16px;height:16px;flex-shrink:0}

  /* Inline validation & tooltips */
  .field-hint-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--fill-2);color:var(--text-dim);font-size:var(--fs-caption);cursor:help;margin-left:4px;position:relative;vertical-align:middle}
  .field-hint-icon:hover{background:var(--accent-tint);color:var(--accent-ink)}
  .field-hint-icon .tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 12px;border-radius:var(--radius-sm);font-size:var(--fs-callout);font-weight:400;line-height:1.5;white-space:normal;width:220px;z-index:100;box-shadow:var(--shadow-pop)}
  .field-hint-icon:hover .tip,.field-hint-icon:focus .tip{display:block}
  .taxid-valid{color:var(--green);font-size:var(--fs-callout);margin-top:4px}
  .taxid-invalid{color:var(--red);font-size:var(--fs-callout);margin-top:4px}

  /* ---- attention list, settings save bar, confirm alert, legacy review ---- */
  .todo-list{padding:8px 24px}
  .todo-list h4{margin:12px 0 4px}
  .todo-row{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:var(--fs-body);flex-wrap:wrap}
  .todo-row:last-child{border-bottom:none}
  .todo-row .todo-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--sys-grey)}
  .todo-row .todo-dot.red{background:var(--sys-red)}
  .todo-row .todo-dot.blue{background:var(--sys-blue)}
  .todo-row .todo-dot.amber{background:var(--sys-yellow)}
  .todo-row .todo-text{flex:1}
  .settings-savebar{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;
    padding:12px 16px;margin-bottom:24px;background:color-mix(in srgb,var(--surface) 88%,transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-radius:var(--radius);box-shadow:var(--shadow-pop)}
  .settings-savebar .save-state{font-size:var(--fs-callout);color:var(--amber);font-weight:600}
  .editor-note{font-size:var(--fs-callout);color:var(--text-faint);margin-top:8px}
  .confirm-overlay{position:fixed;inset:0;z-index:2100;display:none;align-items:center;justify-content:center;padding:24px;background:var(--scrim)}
  .confirm-overlay.open{display:flex}
  .confirm-box{width:100%;max-width:420px;background:var(--surface);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);padding:24px;animation:modalIn .2s ease-out}
  .confirm-msg{font-size:var(--fs-title3);font-weight:600;line-height:1.4;white-space:pre-line}
  .confirm-detail{font-size:var(--fs-body);color:var(--text-dim);margin-top:8px;line-height:1.5;white-space:pre-line}
  .confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
  .date-preview{color:var(--text-dim)}
  .date-preview:empty{display:none}
  .legacy-group{padding:16px 24px}
  .legacy-record{font-size:var(--fs-body);padding:4px 0}
  .legacy-choices{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft)}
  .legacy-rep{margin:0 0 0 24px;max-width:420px}
  .legacy-answered{padding:12px 0;border-bottom:1px solid var(--border-soft)}
  .legacy-answered:last-child{border-bottom:none}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  html{scroll-padding-bottom:24px}
  .document-brand-preview{--accent:var(--document-accent);--accent-ink:var(--document-accent-ink)}
  .brand-controls,.brand-presets,.document-brand-preview{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand-controls{gap:16px;margin-bottom:16px}
  .brand-controls .field{margin:0;width:160px;max-width:100%}
  .brand-color-input{appearance:none;flex:0 0 48px;width:48px;height:48px;padding:8px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer}
  .brand-color-input::-webkit-color-swatch-wrapper{padding:0}
  .brand-color-input::-webkit-color-swatch{border:0;border-radius:var(--radius-sm)}
  .brand-swatch{position:relative;flex:0 0 48px;width:48px;height:48px;min-height:48px;padding:8px;border-radius:var(--radius-pill)}
  .brand-swatch::before{content:'';display:block;width:32px;height:32px;border-radius:var(--radius-pill);background:var(--swatch-color);border:1px solid var(--border-soft)}
  .brand-swatch[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--text)}
  .brand-swatch .swatch-check{display:none}.brand-swatch[aria-pressed="true"] .swatch-check{display:flex;align-items:center;justify-content:center;position:absolute;right:0;bottom:0;width:16px;height:16px;line-height:16px;font-size:12px;font-weight:700;border-radius:var(--radius-pill);background:var(--surface);color:var(--text)}
  .document-brand-preview{margin-top:16px;color:var(--accent-ink)}
  .brand-preview-bar{width:80px;height:16px;background:var(--accent);border-radius:var(--radius-pill)}
  .brand-preview-label{color:var(--text-dim)}

  /* ---- narrow windows: icon-only sidebar rail ---- */
  @media screen and (max-width:1100px){
    .sidebar{width:72px}
    .brand{padding:12px 0 8px;justify-content:center}
    .brand > div:not(.mark){display:none}
    .nav{padding:8px 10px}
    .nav button{justify-content:center;padding:6px 0}
    .nav button span[data-t],.cmdk-hint span[data-t]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .nav .badge{position:absolute;top:2px;right:6px;margin:0;padding:0 5px;min-width:16px;font-size:var(--fs-caption)}
    .cmdk-hint kbd{display:none}
    .cmdk-hint{justify-content:center;width:calc(100% - 20px);margin:4px 10px 8px;padding:0}
    .file-status{padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));justify-content:center;font-size:0}
    .file-status .dot{margin:0}
    .topbar{padding-left:20px;padding-right:20px}
    .content{padding:16px 20px 48px}
    .doc-list{grid-template-columns:minmax(0,1fr)}
  }
  @media screen and (max-width:760px){
    .topbar{align-items:flex-start;flex-wrap:wrap;padding-left:16px;padding-right:16px}
    .topbar h2{font-size:var(--fs-title2)}
    .content{padding:16px 16px 48px}
    .pillars,.report-cards,.report-grid,.filing-grid{grid-template-columns:minmax(0,1fr)}
    .mini-stats{grid-template-columns:1fr!important}
    .pillar .val{font-size:36px}
    .document-main{gap:16px;padding:16px}
    .document-footer{padding:12px 16px}
    .document-amount{max-width:160px}
    .document-amount strong{font-size:20px}
    .toolbar{flex-wrap:wrap}
    .toolbar .search{flex:1 0 100%;min-width:0;max-width:none}
    .doc-list-compact .document-card{grid-template-columns:minmax(0,1fr)}

<script>
/* ============================================================
   STATE & STORAGE
   ============================================================ */
const LS_KEY = 'billing_app_data_v1';

let fileHandle = null;      // File System Access API handle (in-memory)
let pendingHandle = null;   // a saved handle that needs a click to re-grant permission
let dirty = false;          // unsaved changes vs file
let storageOK = true;       // is localStorage usable on this origin?
let DB = null;              // the whole database object
let loadFailed = false; // Block saves until explicit recovery after a failed load.
let loadErrorCode='';

const supportsFSA = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;

/* When running inside the packaged desktop app, storage goes through the
   native bridge (window.billingAPI) instead of the browser File System APIs. */
const IS_ELECTRON = !!(window.billingAPI && window.billingAPI.isElectron);
/* Mac App Store build: Pro ผ่าน In-App Purchase เท่านั้น (ห้ามลิงก์ซื้อภายนอก/ช่องวางรหัส — กติกา 3.1.1)
   ไม่มีไฟล์ข้อมูลภายนอก (รอ security-scoped bookmarks) */
const IS_MAS = !!(window.billingAPI && window.billingAPI.isMas);
// Store flavours (Mac App Store, iPhone/iPad) offer "import from the previous version"; the direct build offers the move export instead.
const IS_STORE_BUILD = IS_MAS || !!(window.billingAPI && window.billingAPI.isMobile);
let dataLoc = { mode:'app', path:'' };            // Electron: 'app' folder vs 'external' file
const baseName = p => String(p||'').split(/[\\/]/).pop();

/* ---------- IndexedDB: remember the billing.json handle across refreshes ---------- */
const IDB_NAME='billing_app', IDB_STORE='kv', HANDLE_KEY='fileHandle';
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);}); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=()=>res();}); }
async function rememberHandle(h){ try{ await idbSet(HANDLE_KEY,h); }catch(e){} }

function blankDB(){
  return {
    version: 3,   // v3 = canonical review matching and explicit decision ancestry
    business: {
      businessName: '',
      businessNameEn: '',
      address: '',
      addressEn: '',       // used on English-language documents (falls back to address)
      taxId: '',
      phone: '',
      email: '',
      bankName: '',
      bankAccount: '',
      bankAccountName: '',
      bankNameEn: '',        // international transfer block (English/foreign-currency invoices)
      bankAccountNameEn: '',
      swiftCode: '',
      bankAddress: '',
      promptpayId: '',     // phone (10 digits) or national/tax ID (13 digits) for PromptPay QR
      logo: '',
      signature: '',       // dataURL — scanned signature shown above the issuer line
      stamp: '',           // dataURL — company stamp (ตราประทับ) overlaid near signature
      brandColor: '#ff6b00',  // seller's document brand; independent of the app palette
      isVatRegistered: false,
      vatStatus: 'unknown', // Confirmation is separate from the legacy VAT toggle.
      defaultVatRate: 7,
      defaultWhtRate: 0,
      defaultTerms: 'ชำระภายใน 30 วัน',
      defaultTermsEn: '',  // terms line on English documents (falls back to defaultTerms)
      currency: 'THB',
      lang: 'th',          // document language: th | bilingual
      uiLang: 'th',        // app UI language: th | en
      yearMode: 'be',      // be (พ.ศ.) | ce (ค.ศ.)
      numberFormats: {
        quotation: 'QT-{YY}-{###}',
        invoice:   'INV-{YY}-{###}',
        receipt:   'RC-{YY}-{###}',
        tax_invoice:'TX-{YY}-{###}'
      },
      updatedAt: ''        // v2: โปรไฟล์ธุรกิจ sync เป็น record เดียว
    },
    clients: [],
    documents: [],
    syncV3: null, // Native pilot metadata; atomically persisted with billing records.
    reviewEvents: [], // Append-only evidence and separately reviewed payment facts; never an original reconstruction.
    assets: {},       // Business images kept once, by SHA-256; new issued originals refer to them as "asset:<hash>".
    recurring: [],  // recurring invoice templates
    counters: {},   // { "quotation-68": 3, ... }
    meta: { lastBackupAt: '', setupDone: false, demo: false, reviewSemanticsVersion:3 }   // lastBackupAt: last manual export · setupDone: first-run wizard finished/skipped · demo: sample data loaded
  };
}

/* ---------- persistence ---------- */
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); storageOK=true; }
  catch(e){ storageOK=false; }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ storageOK=false; }
  return null;
}
// Read DB straight from the connected billing.json on disk (source of truth).
async function loadFromHandle(){
  const file = await fileHandle.getFile();
  const text = await file.text();
  if(text.trim()) adoptDatabase(JSON.parse(text));
  saveLocal();
  dirty = false;
}

async function writeToFile(){
  if(!fileHandle) return false;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(DB, null, 2));
    await w.close();
    dirty = false;
    updateFileStatus();
    return true;
  }catch(e){
    toast(tr('บันทึกไฟล์ไม่สำเร็จ:')+' '+e.message, 'err');
    return false;
  }
}

/* ---------- change journal (v2) ----------
   persist() เขียน event ต่อ record ที่เปลี่ยน (ตรวจจาก updatedAt) ลงไฟล์ NDJSON รายเดือน
   ผ่าน main.js — เป็นฐานของ Google Drive Workspace Sync (Pro) ในเฟสถัดไป
   journal พังต้องไม่ทำให้การบันทึกข้อมูลจริงล้มเด็ดขาด */
let journalIndex = null;   // Map id -> {type, u: updatedAt ล่าสุดที่ลง journal แล้ว}
function buildJournalIndex(){
  journalIndex = new Map();
  const idx=(arr,type)=>arr.forEach(r=>{ if(r.id) journalIndex.set(r.id,{type,u:r.updatedAt||''}); });
  idx(DB.documents,'document'); idx(DB.clients,'client'); idx(DB.recurring,'recurring');
  journalIndex.set('~business',{type:'business',u:DB.business.updatedAt||''});
  journalIndex.set('~counters',{type:'counters',u:JSON.stringify(DB.counters)});
}
function collectJournalEvents(){
  if(!journalIndex){ buildJournalIndex(); return []; }
  const evs=[], seen=new Set();
  const ev=(type,id,op,record)=>evs.push({v:2,eventId:uid(),deviceId:DEVICE_ID,at:nowISO(),type,recordId:id,op,record});
  const scan=(arr,type)=>arr.forEach(r=>{
    if(!r.id) return; seen.add(r.id);
    const prev=journalIndex.get(r.id);
    if(!prev || prev.u!==(r.updatedAt||'')){
      ev(type,r.id,r.deletedAt?'delete':'upsert',r);
      journalIndex.set(r.id,{type,u:r.updatedAt||''});
    }
  });
  scan(DB.documents,'document'); scan(DB.clients,'client'); scan(DB.recurring,'recurring');
  const bPrev=journalIndex.get('~business');
  if(!bPrev || bPrev.u!==(DB.business.updatedAt||'')){
    ev('business','~business','upsert',DB.business);
    journalIndex.set('~business',{type:'business',u:DB.business.updatedAt||''});
  }
  // counters เป็น singleton — sync ฝั่งรับใช้ max-merge ต่อ key กันเลขเอกสารถอยหลัง
  const cSig = JSON.stringify(DB.counters);
  const cPrev = journalIndex.get('~counters');
  if(!cPrev || cPrev.u!==cSig){
    ev('counters','~counters','upsert',{...DB.counters});
    journalIndex.set('~counters',{type:'counters',u:cSig});
  }
  // record ที่หายไปจาก DB ทั้งก้อน (เช่น ล้างข้อมูลตัวอย่าง / purge tombstone) = hard delete
  for(const [id,meta] of [...journalIndex]){
    if(id!=='~business' && id!=='~counters' && !seen.has(id)){ ev(meta.type,id,'delete',null); journalIndex.delete(id); }
  }
  return evs;
}
function appendJournal(){
  try{
    if(!IS_ELECTRON || !window.billingAPI.journalAppend) return;
    const evs=collectJournalEvents();
    if(evs.length) window.billingAPI.journalAppend(evs.map(e=>JSON.stringify(e)).join('\n'));
  }catch(e){ /* เงียบ — ห้ามขวางการบันทึกข้อมูลจริง */ }
}
// บอก journal ว่า record นี้เพิ่งรับมาจากเครื่องอื่น — persist ครั้งถัดไปจะได้ไม่ส่งซ้ำ (กัน echo)
function journalMark(type,id,updatedAt){ if(journalIndex) journalIndex.set(id,{type,u:updatedAt||''}); }

/* ============================================================
   BillNgai Pro (Phase E) + Google Drive Workspace Sync (Phase D)
   Local = ownership · Pro = peace of mind — sync ผ่าน Drive ของผู้ใช้เอง
   BillNgai ไม่มีเซิร์ฟเวอร์เก็บเอกสารลูกค้า และ Pro ทำงานออฟไลน์ได้เสมอ
   ============================================================ */
let PRO = { valid:false };
function isPro(){ return !!(PRO && PRO.valid); }
let syncInfo = { configured:false, connected:false, email:'', lastSyncAt:null, devices:[] };
let syncV3Info = {configured:false,connected:false,conflicts:[],pending:0};
let syncBusy = false, syncErr = '', syncConflicts = [], syncTimer = null;
// 2.0.4 containment: do not acknowledge cloud events before durable conflict
// history and cross-device issuance/number allocation have been validated.
const CLOUD_SYNC_PAUSED = true;
function isSyncEnabled(){ if(syncV3Info.connected) return IS_ELECTRON && !loadFailed; return !CLOUD_SYNC_PAUSED && IS_ELECTRON && !loadFailed && isPro() && syncInfo.connected; }

// ฟิลด์การเงิน/ทางการ — ห้าม merge เงียบ ๆ เด็ดขาด (PRD §17)
const SYNC_PROTECTED = ['number','status','paidDate','issueDate','dueDate','currency','fxRate','vatRate','whtRate','incomeCategory','whtCertReceived','whtCertNo','whtCertDate'];
function itemsSig(items){ return JSON.stringify((items||[]).map(it=>[it.description,it.qty,it.unit,it.price])); }
function protectedDiff(a,b){
  if(!(a.type||b.type)) return false;   // clients/recurring = last-write-wins ทั้ง record
  for(const k of SYNC_PROTECTED){ if(JSON.stringify(a[k]??null)!==JSON.stringify(b[k]??null)) return true; }
  return itemsSig(a.items)!==itemsSig(b.items);
}
function arrOfType(t){ return t==='document'?DB.documents : t==='client'?DB.clients : t==='recurring'?DB.recurring : null; }

/* merge engine: last-write-wins ต่อ record + ฟิลด์การเงินชนกัน → ค้างเป็น conflict ให้ผู้ใช้เลือก
   includeOwn ใช้เฉพาะตอนกู้คืนจากคลาวด์ (replay event ของทุกเครื่องทับสแนปช็อต) */
function applySyncEvents(events, lastPullAt, includeOwn){
  const res = { applied:0, conflicts:[], renumbered:0 };
  const latest = new Map(); const counterEvents = [];
  for(const ev of (events||[])){
    if(!ev || !ev.recordId) continue;
    if(!includeOwn && ev.deviceId===DEVICE_ID) continue;
    if(ev.type==='counters'){ counterEvents.push(ev); continue; }
    const prev = latest.get(ev.recordId);
    if(!prev || String(prev.at||'')<=String(ev.at||'')) latest.set(ev.recordId, ev);
  }
  for(const [id, ev] of latest){
    if(id==='~business'){
      const rb = ev.record||{};
      // โปรไฟล์เปล่า (เช่น ผ่าน wizard บนเครื่องใหม่โดยไม่กรอกอะไร) ห้ามทับโปรไฟล์จริงเด็ดขาด —
      // บั๊กจริงที่เจอ: เครื่อง B ล้างชื่อ/โลโก้/PromptPay ของเครื่อง A ผ่าน sync
      const remoteBlank = !String(rb.businessName||'').trim() && !(rb.logo||'') && !String(rb.taxId||'').trim();
      const localNamed = !!String(DB.business.businessName||'').trim() || !!(DB.business.logo||'');
      if(remoteBlank && localNamed) continue;
      if((rb.updatedAt||'') > (DB.business.updatedAt||'')){
        DB.business = {...blankDB().business, ...rb};
        journalMark('business','~business',DB.business.updatedAt);
        res.applied++;
      }
      continue;
    }
    const arr = arrOfType(ev.type); if(!arr) continue;
    // hard delete ไม่มี payload → สังเคราะห์ tombstone จากเวลา event
    const remote = ev.record || { id, deletedAt: ev.at||nowISO(), updatedAt: ev.at||nowISO() };
    const local = arr.find(r=>r.id===id);
    if(!local){ arr.push(remote); journalMark(ev.type,id,remote.updatedAt); res.applied++; continue; }
    if((remote.updatedAt||'')===(local.updatedAt||'')) continue;               // ตรงกันอยู่แล้ว
    const localChanged = (local.updatedAt||'') > (lastPullAt||'');
    if(localChanged && protectedDiff(local, remote)){
      // แก้ทั้งสองฝั่งหลัง sync ล่าสุด และฟิลด์การเงินไม่ตรงกัน — ให้ผู้ใช้ตัดสิน (local ยังชนะจนกว่าจะเลือก)
      res.conflicts.push({ kind:'record', type:ev.type, id, local:JSON.parse(JSON.stringify(local)), remote });
      continue;
    }
    if((remote.updatedAt||'') > (local.updatedAt||'')){
      arr[arr.indexOf(local)] = remote;
      journalMark(ev.type,id,remote.updatedAt);
      res.applied++;
    }
    // remote เก่ากว่า → local ชนะ แล้วฝั่งนี้จะ push กลับไปเอง
  }
  for(const ev of counterEvents){   // max-merge ต่อ key — เลขเอกสารเดินหน้าอย่างเดียว
    for(const [k,v] of Object.entries(ev.record||{})) DB.counters[k] = Math.max(Number(DB.counters[k]||0), Number(v)||0);
  }
  res.renumbered = reconcileNumbers(res.conflicts);
  syncConflicts = res.conflicts;
  return res;
}
// เลขเอกสารชนกันข้ามเครื่อง (PRD §18): ใบร่างถูกตั้งเลขใหม่อัตโนมัติ · ออกแล้วทั้งคู่ → ผู้ใช้ตัดสิน
function reconcileNumbers(conflicts){
  let renumbered = 0;
  const seen = new Map();
  const docs = activeDocs().slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  for(const d of docs){
    if(!d.number) continue;
    const key = d.type+'|'+d.number;
    const first = seen.get(key);
    if(!first){ seen.set(key,d); continue; }
    const draft = d.status==='draft' ? d : (first.status==='draft' ? first : null);
    if(draft){
      // counters อาจตามหลังเอกสารจริง (ไฟล์เก่า/ต่างปีปฏิทิน) — เดินหน้าจนพ้นเลขที่ถูกใช้แล้วเสมอ
      let n;
      do { n = nextNumber(draft.type, draft.issueDate); commitNumber(draft.type, draft.issueDate); }
      while(activeDocs().some(x=>x!==draft && x.type===draft.type && x.number===n));
      draft.number = n;
      touch(draft); renumbered++;
      if(draft===first) seen.set(key,d);
    }else{
      conflicts.push({ kind:'number', type:'document', id:d.id, otherId:first.id, number:d.number });
    }
  }
  return renumbered;
}

/* ---------- sync orchestration ---------- */
function scheduleSync(){
  if(!isSyncEnabled()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(true), 30000);   // debounce หลังบันทึก
}
async function refreshSyncInfo(){
  if(!IS_ELECTRON || !window.billingAPI.syncStatus) return;
  try{ syncInfo = await window.billingAPI.syncStatus(); if(window.billingAPI.syncV3Status)syncV3Info=await window.billingAPI.syncV3Status(); }catch(e){}
}
async function syncNow(silent){
  if(syncV3Info.connected)return runSyncV3(silent);
  if(CLOUD_SYNC_PAUSED){ if(!silent) toast(tr('ซิงก์รุ่นเดิมหยุดใช้แล้ว — เชื่อมต่อ Google Drive ใหม่ได้ที่ ตั้งค่า → ข้อมูลและสำรอง'),'err'); return; }
  if(!isSyncEnabled() || syncBusy) return;
  syncBusy = true; syncErr = ''; updateFileStatus();
  try{
    const pushed = await window.billingAPI.syncPush();
    const r = await window.billingAPI.syncPull();
    const out = applySyncEvents(r.events||[], r.lastPullAt||'');
    if(out.applied || out.renumbered){
      if(!await persist(true)) throw new Error('DATA_SAVE_FAILED');
      render();
    }
    await window.billingAPI.syncCommitPull(r.cursors||{});
    // ห้ามอัปโหลดสแนปช็อตของ DB ว่าง — เครื่องใหม่จะสร้างสแนปช็อตเปล่ามาบังของจริงใน Drive
    let snapped = false;

      const parts = [];

async function assignSyncNumber(d,key){
  if(!syncV3Info.connected || (!key&&!isIssuedDocument(d)))return uniqueDocumentNumber(d);
  const original=!key&&DB.documents.find(x=>x.id===d.id);
  if(original&&isIssuedDocument(original))return uniqueDocumentNumber(d);
  const fmt=(DB.business.numberFormats[d.type]||d.type.toUpperCase()+'-{YY}-{###}').replace('{YY}',yearToken(d.issueDate));
  const match=fmt.match(/\{?(#+)\}?/);
  const parts={series:counterKey(d.type,d.issueDate),prefix:match?fmt.slice(0,match.index):fmt+'-',suffix:match?fmt.slice(match.index+match[0].length):'',width:match?match[1].length:3};
  d.number=await window.billingAPI.syncV3Reserve(key||'document:'+d.id,parts);return true;
}

function syncErrorText(e){
  const msg=String(e?.message||e||'');
  if(/fetch failed|network|ENOTFOUND|ETIMEDOUT|ECONNRESET/i.test(msg)) return tr('เชื่อมต่อ Google Drive ไม่ได้ตอนนี้ ข้อมูลและร่างในเครื่องยังอยู่ ลองอีกครั้งเมื่อมีอินเทอร์เน็ต');
  const code=Object.keys(SYNC_ERROR_TEXT).find(k=>msg.includes(k));
  return code?tr(SYNC_ERROR_TEXT[code]):tr('เชื่อมต่อไม่สำเร็จ:')+' '+msg.replace(/^Error invoking remote method '[^']+': (Error: )?/,'');
}

async function connectSyncV3(){

  if(!await askConfirm(tr('เชื่อมต่อ Google Drive?'),{detail:tr('ข้อมูลเอกสารเก็บใน Google Drive ของคุณ ทุกเครื่องที่ใช้บัญชีเดียวกันจะเห็นข้อมูลชุดเดียวกัน เครื่องนี้จะสำรองข้อมูลไว้ก่อนเชื่อมต่อ'),confirmLabel:tr('เชื่อมต่อ Google Drive')}))return;

    try{syncV3Info=await window.billingAPI.syncV3Connect({replaceLocal:true,approveProtocol:true});}catch(e2){toast(syncErrorText(e2),'err');return;}
